name: Hunter Health Coverage Tests
on:
  push:
    branches: ['codex/hunter-health-coverage-20261010']
  pull_request:
    paths:
      - 'research/hunter_health_and_queue.py'
      - 'tests/test_hunter_health_and_queue.py'
      - '.github/workflows/hunter-health-coverage-test.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies for the complete Hunter regression
        run: python -m pip install -r deploy/hunter-binance-stream-requirements.txt -r deploy/hunter-fast-watch-requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '18.19.1'
      - name: Health coverage regression (offline fixtures only)
        run: python -m unittest discover -s tests -p 'test_hunter_health_and_queue.py' -v
      - name: Full Hunter regression without production workflow steps
        run: python -m unittest discover -s tests -p 'test_hunter*.py' -v
