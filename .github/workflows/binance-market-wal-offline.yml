name: Binance market WAL offline isolation

on:
  pull_request:
    paths:
      - research/hunter_binance_market_wal.py
      - research/hunter_binance_stream_store.py
      - scripts/provision_binance_market_wal.py
      - tests/test_hunter_binance_market_wal_offline.py
      - .github/workflows/binance-market-wal-offline.yml

permissions:
  contents: read

jobs:
  isolated-wal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert actual candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline WAL safety regression on scratch SQLite only
        run: python -B -X utf8 -m unittest -v tests.test_hunter_binance_market_wal_offline
      - name: Shadow-only source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          code=Path('research/hunter_binance_market_wal.py').read_text()
          assert 'PRAGMA journal_mode=WAL' in code
          assert "control_mode='UNCHANGED'" in code
          assert 'real_trading_enabled=True' not in code
          PY
