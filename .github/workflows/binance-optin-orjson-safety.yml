name: Binance opt-in orjson private copy safety and strict probe

on:
  pull_request:
    paths:
      - research/hunter_binance_stream_consumer.py
      - tests/test_hunter_binance_orjson_copy.py
      - .github/workflows/binance-optin-orjson-safety.yml

permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned optional codec only on scratch CI
        run: python -m pip install orjson==3.11.9
      - name: Exact graph semantics, cache fences, provenance, unsupported-type fallback
        run: |
          python -B -X utf8 -m unittest -v \
            tests.test_hunter_binance_orjson_copy \
            tests.test_hunter_binance_snapshot_copy \
            tests.test_hunter_binance_consumer_fence \
            tests.test_hunter_binance_signal_use \
            tests.test_hunter_binance_revision_copy
  optin-strict-diagnostic:
    needs: safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Pinned internal codec; scratch-only 1228-topic unchanged strict load
        run: python -m pip install orjson==3.11.9
      - name: Preserve 1228 topics and original queue/ingress/assertions
        env:
          BINANCE_EXPERIMENTAL_OWNED_CODEC: ORJSON
        run: python -B -X utf8 -m unittest -v tests.test_hunter_binance_coordinated_soak.WholeRosterSoak.test_complete_1228_topics_during_continuous_wall_load
