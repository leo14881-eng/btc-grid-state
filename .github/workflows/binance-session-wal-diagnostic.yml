name: Binance session WAL mechanism diagnostic

on:
  pull_request:
    paths:
      - scripts/profile_binance_session_topology.py
      - .github/workflows/binance-session-wal-diagnostic.yml

permissions:
  contents: read

jobs:
  scratch-wal-session:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact diagnostic commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install pinned loopback transport dependency
        run: python -m pip install -r deploy/hunter-binance-stream-requirements.txt
      - name: Run full actual session topology against scratch WAL only
        env:
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha }}
          BINANCE_DIAGNOSTIC_MARKET_WAL: '1'
          TMPDIR: ${{ runner.temp }}
        run: |
          python -I -B -X utf8 scripts/profile_binance_session_topology.py \
            > "$RUNNER_TEMP/binance-session-wal-diagnostic.log" 2>&1 || {
              grep -E 'SESSION_WAL_COMPACT|BINANCE_SESSION_TOPOLOGY_(LEG|FINAL)' "$RUNNER_TEMP/binance-session-wal-diagnostic.log" | cut -c1-2000 || true
              exit 1
            }
          grep -E 'SESSION_WAL_COMPACT|BINANCE_SESSION_TOPOLOGY_FINAL' "$RUNNER_TEMP/binance-session-wal-diagnostic.log" | cut -c1-4000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binance-scratch-wal-session-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/binance-session-topology-*/**/*.json
            ${{ runner.temp }}/binance-session-topology-*/*.json
            ${{ runner.temp }}/binance-session-wal-diagnostic.log
          if-no-files-found: warn
