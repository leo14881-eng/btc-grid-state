name: Hunter Change Full Validation
on:
  push:
    branches: [main]
    paths:
      - 'research/hunter_*.py'
      - 'tests/test_hunter*.py'
      - 'research/hunter-capital-state.json'
      - '.github/workflows/hunter-*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hunter-change-full-validation
  cancel-in-progress: true
jobs:
  validate-change:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Hunter Python
        run: |
          python - <<'PY'
          import glob,py_compile
          files=glob.glob('research/hunter_*.py')+glob.glob('tests/test_hunter*.py')
          assert files, 'NO_HUNTER_PYTHON_FOUND'
          for f in files: py_compile.compile(f,doraise=True)
          print('HUNTER_PYTHON_COMPILE_OK',len(files))
          PY
      - name: Run complete Hunter regression suite
        run: python -m unittest discover -s tests -p 'test_hunter*.py' -v
      - name: Validate persisted Hunter state contract
        run: |
          python - <<'PY'
          import json,pathlib
          R=pathlib.Path('research/results')
          required=[
            'hunter-cex-universe-run.json','hunter-early-signals.json',
            'hunter-forward-research.json','hunter-identity-audit.json','hunter-liquidity-probe.json',
            'hunter-tactical-supply-risk.json','hunter-health-and-queue.json',
            'hunter-tactical-capital-review.json','hunter-shadow-portfolio.json',
            'hunter-shadow-summary.json','hunter-shadow-v2-portfolio.json',
            'hunter-shadow-v2-summary.json','hunter-bybit-availability.json']
          data={}
          for n in required:
            p=R/n
            assert p.exists() and p.stat().st_size>2, f'EMPTY_OR_MISSING_RESULT {n}'
            data[n]=json.load(open(p))
          scan=data['hunter-cex-universe-run.json']
          early=data['hunter-early-signals.json']
          ident=data['hunter-identity-audit.json']
          review=data['hunter-tactical-capital-review.json']
          assert scan.get('binance_complete') is True
          downstream={
            'early': early.get('scan_generation_id'),
            'forward': data['hunter-forward-research.json'].get('scan_generation_id'),
            'identity': ident.get('scan_generation_id'),
            'liquidity': data['hunter-liquidity-probe.json'].get('scan_generation_id'),
            'supply': data['hunter-tactical-supply-risk.json'].get('scan_generation_id'),
            'capital_review': review.get('scan_generation_id'),
            'health': data['hunter-health-and-queue.json'].get('scan_generation_id'),
          }
          generations={v for v in downstream.values() if v}
          assert len(generations)==1 and all(downstream.values()), f'MIXED_PERSISTED_DOWNSTREAM_GENERATIONS {downstream}'
          downstream_generation=next(iter(generations))
          if downstream_generation==scan.get('generation_id'):
            assert ident.get('scan_as_of_utc')==scan.get('as_of_utc'),'IDENTITY_GENERATION_MISMATCH'
            print('PERSISTED_PIPELINE_GENERATION_CURRENT',downstream_generation)
          else:
            # Universe publishes atomically before the downstream Research workflow.
            # A coherent older downstream snapshot is safe to read as OLD, but must
            # never be presented as belonging to the new Universe generation.
            print('PERSISTED_PIPELINE_IN_FLIGHT universe',scan.get('generation_id'),'downstream',downstream_generation)
          for lane in ('','-v2'):
            st=data[f'hunter-shadow{lane}-portfolio.json']; sm=data[f'hunter-shadow{lane}-summary.json']
            opens=st.get('open_positions') or []; closed=st.get('closed_positions') or []
            assets=[x.get('asset') for x in opens if x.get('asset')]
            assert len(assets)==len(set(assets)),f'DUPLICATE_OPEN_ASSET lane={lane}'
            assert int(sm.get('open_positions') or 0)==len(opens),f'SUMMARY_OPEN_MISMATCH lane={lane}'
            assert int(sm.get('closed_positions') or 0)==len(closed),f'SUMMARY_CLOSED_MISMATCH lane={lane}'
            assert st.get('mode')=='SIMULATION_ONLY_NO_REAL_ORDERS'
          v2=data['hunter-shadow-v2-portfolio.json']
          used=sum(sum(float(t.get('notional_usdt') or 0) for t in x.get('tranches') or []) for x in v2.get('open_positions') or [])
          assert used<=20000.000001,f'V2_CAPITAL_POOL_EXCEEDED {used}'
          assert all(x.get('trade_action') in ('BUY','WAIT','REJECT','SYSTEM_BLOCKED') for x in review.get('candidates') or []),'V2_ACTION_TAXONOMY_INVALID'
          print('HUNTER_PERSISTED_STATE_CONTRACT_OK',scan.get('generation_id'),'v1_open',len(data['hunter-shadow-portfolio.json'].get('open_positions') or []),'v2_open',len(v2.get('open_positions') or []),'v2_used',round(used,2))
          PY
      - name: Audit V1 V2 ledger continuity and crypto-only history
        run: |
          python - <<'PY'
          import collections,json
          U=json.load(open('research/results/hunter-cex-universe-run.json'))
          excluded=set((((U.get('venue_status') or {}).get('binance') or {}).get('excluded_bstocks') or []))
          assert excluded, 'CRYPTO_SCOPE_BSTOCK_CLASSIFICATION_MISSING'
          for label,path,prefix in (
              ('V1','research/results/hunter-shadow-portfolio.json','SHADOW_V1_'),
              ('V2','research/results/hunter-shadow-v2-portfolio.json','SHADOW_V2_')):
              s=json.load(open(path)); opens=s.get('open_positions') or []; closed=s.get('closed_positions') or []
              events=s.get('events') or []; decisions=s.get('decisions') or []
              names=[x.get('asset') for x in opens if x.get('asset')]
              assert len(names)==len(set(names)), f'{label}_DUPLICATE_OPEN'
              active=set(names)|{x.get('asset') for x in closed}|{x.get('asset') for x in events}|{x.get('asset') for x in decisions}|set(s.get('ever_entered_assets') or [])
              assert not (active & excluded), f'{label}_ACTIVE_BSTOCK_HISTORY {sorted(active & excluded)}'
              buys={x.get('asset') for x in events if x.get('type')==prefix+'BUY' and x.get('asset')}
              sells={x.get('asset') for x in events if x.get('type')==prefix+'SELL' and x.get('asset')}
              position_assets={x.get('asset') for x in opens+closed if x.get('asset')}
              if not s.get('event_history_truncated'):
                  assert position_assets <= buys, f'{label}_POSITION_WITHOUT_BUY_EVENT {sorted(position_assets-buys)}'
                  assert {x.get('asset') for x in closed if x.get('asset')} <= sells, f'{label}_CLOSED_WITHOUT_SELL_EVENT'
              for x in opens+closed:
                  assert x.get('tranches'), f'{label}_POSITION_WITHOUT_TRANCHES {x.get("asset")}'
                  assert all(float(t.get('notional_usdt') or 0)>0 and float(t.get('price') or 0)>0 for t in x.get('tranches') or []), f'{label}_INVALID_TRANCHE {x.get("asset")}'
              for x in closed:
                  assert isinstance(x.get('net_pnl_usdt'),(int,float)), f'{label}_CLOSED_PNL_MISSING {x.get("asset")}'
              q={k:len(s.get(k) or []) for k in ('excluded_non_crypto_positions','excluded_non_crypto_closed_positions','excluded_non_crypto_events','excluded_non_crypto_decisions','excluded_non_crypto_ever_entered_assets')}
              counts=collections.Counter(x.get('type') for x in events)
              print('LEDGER_CONTINUITY_OK',label,'open',len(opens),'closed',len(closed),'events',dict(counts),'quarantine',q,'event_history_truncated',int(s.get('event_history_truncated') or 0))
          PY
      - name: Require full live pipeline after code change
        run: |
          echo 'STATIC_AND_STATE_REGRESSION_OK'
          echo 'The Hunter Potential Research Pipeline is the authoritative live-data end-to-end acceptance run.'
