name: Stock Shadow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/stock_shadow/**'
      - 'tests/test_stock_shadow.py'
      - '.github/workflows/stock-shadow.yml'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: stock-shadow-main
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test isolated Stock Shadow
        run: python -m pytest -q tests/test_stock_shadow.py
      - name: Free benchmark snapshot
        continue-on-error: true
        run: python research/stock_shadow/stock_benchmark.py
      - name: SEC public-data health
        continue-on-error: true
        run: python research/stock_shadow/stock_sec_monitor.py
      - name: Alpaca batch data diagnostic
        continue-on-error: true
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python research/stock_shadow/alpaca_diagnostic.py
      - name: SEC bulk archive diagnostic
        timeout-minutes: 2
        run: |
          python - <<'PY'
          import urllib.request
          urls=[
            "https://www.sec.gov/Archives/edgar/daily-index/xbrl/companyfacts.zip",
            "https://www.sec.gov/Archives/edgar/daily-index/bulkdata/submissions.zip",
          ]
          for u in urls:
              req=urllib.request.Request(u,headers={"User-Agent":"stock-shadow-research/1.0 leo14881-eng@users.noreply.github.com","Range":"bytes=0-3"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      b=r.read(4)
                      print("SEC_BULK_OK",u,"status",r.status,"type",r.headers.get("Content-Type"),"length",r.headers.get("Content-Length"),"magic",b.hex())
              except Exception as e:
                  print("SEC_BULK_FAIL",u,type(e).__name__,str(e))
          PY
      - name: Observe fundamentals (no strategy effect)
        timeout-minutes: 8
        run: python research/stock_shadow/fundamentals_observer.py
      - name: Run Stock Shadow V1
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python research/stock_shadow/stock_shadow_v1.py
      - name: Winner loser review
        run: python research/stock_shadow/stock_review.py
      - name: Isolation guard
        run: |
          git diff --name-only | grep -Ev '^research/results/stock-shadow/' && { echo "Isolation violation"; exit 1; } || true
      - name: Persist Stock Shadow state only
        run: |
          git config user.name "stock-shadow-bot"
          git config user.email "stock-shadow-bot@users.noreply.github.com"
          git add research/results/stock-shadow/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update stock shadow state"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Failed to persist Stock Shadow results after retries"
          exit 1
