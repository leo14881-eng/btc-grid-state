name: Stock Shadow
# DXYZ_SCHEMA7_DIAGNOSTIC
# DXYZ_PENDING_DIAGNOSTIC
# FUNDAMENTALS_SCHEMA6_ACCEPTANCE
# FUNDAMENTALS_308_ACCEPTANCE_20261005
# IFRS_FIX_ACCEPTANCE_20261005

# CACHE_FIRST_FINAL_ACCEPTANCE_20261005
# CACHE_FIRST_FINAL_ACCEPTANCE_20261005_R2
# Acceptance marker: Replay chronological acceptance 2026-10-04
# FINAL_FMP_ACCEPTANCE_RUN_20261005

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/stock_shadow/**'
      - 'tests/test_stock_shadow.py'
      - 'tests/test_stock_server_migration.py'
      - '.github/stock-runtime.json'
      - 'research/stock_shadow/server/**'
      - 'deploy/stock-shadow/**'
      - '.github/workflows/stock-shadow.yml'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: stock-shadow-main
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Admit authoritative stock writer
        id: admission
        run: python3 -m research.stock_shadow.server.runtime admit --owner github --job main --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
      - uses: actions/setup-python@v5
        if: steps.admission.outputs.should_run == 'true'
        with:
          python-version: '3.12'
      - name: Install test dependency
        if: steps.admission.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test isolated Stock Shadow
        if: steps.admission.outputs.should_run == 'true'
        run: python -m pytest -q tests/test_stock_shadow.py tests/test_stock_server_migration.py
      - name: P0 weekend and final mutation gate acceptance
        if: steps.admission.outputs.should_run == 'true'
        run: python -m pytest -q tests/test_stock_shadow.py -k p0
      - name: Observe fundamentals (no strategy effect)
        if: steps.admission.outputs.should_run == 'true'
        timeout-minutes: 8
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          STOCKFIT_API_KEY: ${{ secrets.STOCKFIT_API_KEY }}
        run: python research/stock_shadow/fundamentals_observer.py
      - name: Run Stock Shadow V1
        if: steps.admission.outputs.should_run == 'true'
        id: stock_scan
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python research/stock_shadow/stock_shadow_v1.py
      - name: Winner loser review
        if: steps.admission.outputs.should_run == 'true'
        run: python research/stock_shadow/stock_review.py
      - name: Isolation guard
        if: steps.admission.outputs.should_run == 'true'
        run: |
          bash research/stock_shadow/isolation_guard.sh
      - name: Persist Stock Shadow state only
        if: steps.admission.outputs.should_run == 'true'
        run: bash research/stock_shadow/persist_results.sh main

# FINAL_API_ARCH_ACCEPTANCE_R3

# FINAL_ACCEPTANCE_R4

# STOCK_MAIN_STABLE_TRIGGER_R5

# WEEKEND_LEDGER_GATE_ACCEPTANCE_20261005

# CLEAN_WEEKEND_BASELINE_FINAL_ACCEPTANCE_20261005


      - name: Persist failure health only
        if: ${{ failure() && steps.admission.outputs.should_run == 'true' && steps.stock_scan.outcome == 'failure' }}
        run: |
          bash research/stock_shadow/isolation_guard.sh
          bash research/stock_shadow/persist_results.sh health
