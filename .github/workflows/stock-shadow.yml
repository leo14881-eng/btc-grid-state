name: Stock Shadow
# Acceptance marker: stable contract revalidation 2026-10-04

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/stock_shadow/**'
      - 'tests/test_stock_shadow.py'
      - '.github/workflows/stock-shadow.yml'
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: write

concurrency:
  group: stock-shadow-main
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bind execution version
        run: |
          echo "STOCK_SHADOW_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "STOCK_SHADOW_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test isolated Stock Shadow
        run: python -m pytest -q tests/test_stock_shadow.py
      - name: Free benchmark snapshot
        continue-on-error: true
        run: python research/stock_shadow/stock_benchmark.py
      - name: SEC public-data health
        continue-on-error: true
        run: python research/stock_shadow/stock_sec_monitor.py
      - name: Alpaca batch data diagnostic
        continue-on-error: true
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python research/stock_shadow/alpaca_diagnostic.py
      - name: Observe fundamentals (no strategy effect)
        timeout-minutes: 8
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python research/stock_shadow/fundamentals_observer.py
      - name: Run Stock Shadow V1
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python research/stock_shadow/stock_shadow_v1.py
      - name: Winner loser review
        run: python research/stock_shadow/stock_review.py
      - name: Isolation guard
        run: |
          git diff --name-only | grep -Ev '^research/results/stock-shadow/' && { echo "Isolation violation"; exit 1; } || true
      - name: Persist Stock Shadow state only
        run: |
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- research/stock_shadow tests/test_stock_shadow.py .github/workflows/stock-shadow.yml .github/workflows/stock-shadow-position-monitor.yml; then
            echo "Stock Shadow code changed during this run; refusing stale-result persistence"
            exit 42
          fi
          git config user.name "stock-shadow-bot"
          git config user.email "stock-shadow-bot@users.noreply.github.com"
          git add research/results/stock-shadow/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: update stock shadow state"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo "Failed to persist Stock Shadow results after retries"
          exit 1
