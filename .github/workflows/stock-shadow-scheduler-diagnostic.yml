name: Stock Scheduler Runtime Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect stock deployed handlers and trigger metadata read only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STOCK }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PYCODE'
          import hashlib, json, os, re, urllib.request, urllib.error
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          if not re.fullmatch(r'[a-fA-F0-9]{32}', account):
              raise SystemExit('INVALID_ACCOUNT_ID')
          worker = 'stock-shadow-scheduler'
          base = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/'
          def read(path, raw=False):
              req = urllib.request.Request(base + path, headers={
                  'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'],
                  'User-Agent': 'stock-scheduler-read-only-diagnostic'})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      content, kind = r.read(), r.headers.get('Content-Type', '')
              except urllib.error.HTTPError as e:
                  raise RuntimeError('CF_READ_HTTP_' + str(e.code)) from None
              except Exception:
                  raise RuntimeError('CF_READ_FAILED') from None
              if raw:
                  return content, kind
              d = json.loads(content)
              if not d.get('success'):
                  raise RuntimeError('CF_READ_REJECTED')
              return d['result']
          try:
              scripts = read('workers/scripts?per_page=1000')
              script = next((s for s in scripts if s.get('id') == worker), None)
              if script is None:
                  raise RuntimeError('STOCK_WORKER_NOT_FOUND')
              safe = {k: script.get(k) for k in ('id','handlers','named_handlers','etag',
                  'created_on','modified_on','has_modules','last_deployed_from','migration_tag')}
              print('STOCK_DEPLOYED_SCRIPT=' + json.dumps(safe), flush=True)
              settings = read('workers/scripts/' + worker + '/settings')
              print('STOCK_DEPLOYED_SETTINGS=' + json.dumps({k: settings.get(k) for k in
                  ('compatibility_date','compatibility_flags','limits','placement','observability')}), flush=True)
              print('STOCK_DEPLOYED_BINDINGS=' + json.dumps([
                  {k:b.get(k) for k in ('name','type','class_name','script_name','environment','namespace_id') if k in b}
                  for b in settings.get('bindings',[])]), flush=True)
              print('STOCK_DEPLOYED_SCHEDULES=' + json.dumps(read('workers/scripts/' + worker + '/schedules')), flush=True)
              deployments = read('workers/scripts/' + worker + '/deployments')
              for d in deployments.get('deployments',[])[:3]:
                  print('STOCK_DEPLOYMENT=' + json.dumps({k:d.get(k) for k in ('id','created_on','strategy','versions')}), flush=True)
                  for v in d.get('versions',[]):
                      vid = v.get('version_id','')
                      if not re.fullmatch(r'[a-fA-F0-9-]{36}', vid):
                          raise RuntimeError('INVALID_VERSION_ID')
                      version = read('workers/scripts/' + worker + '/versions/' + vid)
                      resources = version.get('resources',{})
                      metadata = version.get('metadata',{})
                      print('STOCK_VERSION=' + json.dumps({'id':version.get('id'),
                          'metadata':{k:metadata.get(k) for k in ('created_on','modified_on','source')},
                          'script':{k:resources.get('script',{}).get(k) for k in ('etag','handlers','named_handlers')},
                          'settings':{k:resources.get('script_runtime',{}).get(k) for k in ('compatibility_date','compatibility_flags')}}), flush=True)
              # Read source only in memory; log hashes and known-source match booleans, never code or secret values.
              body, kind = read('workers/scripts/' + worker + '/content', raw=True)
              modules = []
              if 'multipart/' in kind:
                  msg = BytesParser(policy=default).parsebytes(('Content-Type: '+kind+'\r\nMIME-Version: 1.0\r\n\r\n').encode()+body)
                  for part in msg.iter_parts():
                      payload = part.get_payload(decode=True) or b''
                      modules.append({'sha256':hashlib.sha256(payload).hexdigest(), 'bytes':len(payload),
                          'has_scheduled_handler':b'async scheduled(' in payload,
                          'has_stock_do_name':b'stock-shadow-main' in payload,
                          'has_stock_workflow':b'stock-shadow-position-monitor.yml' in payload})
              else:
                  modules = [{'sha256':hashlib.sha256(body).hexdigest(),'bytes':len(body),
                      'has_scheduled_handler':b'async scheduled(' in body,'has_stock_do_name':b'stock-shadow-main' in body,
                      'has_stock_workflow':b'stock-shadow-position-monitor.yml' in body}]
              print('STOCK_REMOTE_MODULE_HASHES=' + json.dumps(modules), flush=True)
              print('STOCK_LOCAL_SOURCE_SHA256=' + hashlib.sha256(Path('research/stock_shadow/scheduler/worker.mjs').read_bytes()).hexdigest(), flush=True)
          except Exception as e:
              print('STOCK_METADATA_ERROR=' + (str(e) if re.fullmatch(r'[A-Z0-9_]+',str(e)) else 'READ_FAILED'), flush=True)
              raise SystemExit(1) from None
          PYCODE
      - name: Read public stock health
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error
          url = 'https://stock-shadow-scheduler.qinx468.workers.dev/health'
          try:
              req = urllib.request.Request(url, headers={'User-Agent':'stock-scheduler-read-only-acceptance'})
              r = urllib.request.urlopen(req, timeout=20)
          except urllib.error.HTTPError as e:
              if e.code != 503:
                  print('STOCK_PUBLIC_HEALTH_HTTP=' + str(e.code))
                  print('STOCK_PUBLIC_HEALTH_CONTENT_TYPE=' + str(e.headers.get('Content-Type')))
                  raise SystemExit(0)
              r = e
          with r:
              data = json.load(r)
          allowed = ['checked_at','action','error','market','stale','workflow','dispatched','scheduler_healthy']
          print('STOCK_RUNTIME_HEALTH=' + json.dumps({k: data.get(k) for k in allowed}))
          PY
      - name: Observe stock runtime traces read only
        working-directory: research/stock_shadow/scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STOCK }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          python - <<'PY'
          import json, subprocess, time, select, os
          names=['stock-shadow-scheduler']
          streams={}
          processes=[]
          for name in names:
              p=subprocess.Popen(['npx','--yes','wrangler@4.147.0','tail',name,'--format','json'],stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              processes.append(p)
              streams[p.stdout]={'name':name,'p':p,'pending':'','connected':False,'count':0}
          deadline=time.monotonic()+360
          try:
              while time.monotonic()<deadline and streams:
                  ready,_,_=select.select(list(streams),[],[],5)
                  for stream in ready:
                      s=streams[stream]
                      chunk=os.read(stream.fileno(),65536).decode('utf-8',errors='replace')
                      if not chunk:
                          print('RUNTIME_TRACE_PROCESS_EXIT='+json.dumps({'worker':s['name'],'code':s['p'].poll()}),flush=True)
                          del streams[stream]
                          continue
                      if 'Connected to' in chunk or 'Successfully created tail' in chunk:
                          s['connected']=True
                          print('RUNTIME_TRACE_CONNECTED='+s['name'],flush=True)
                      s['pending']+=chunk
                      while True:
                          start=s['pending'].find('{')
                          if start<0:
                              s['pending']=''
                              break
                          s['pending']=s['pending'][start:]
                          try: d,used=json.JSONDecoder().raw_decode(s['pending'])
                          except json.JSONDecodeError:
                              if len(s['pending'])>200000: s['pending']=''
                              break
                          s['pending']=s['pending'][used:]
                          event=d.get('event') or {}
                          safe={k:d.get(k) for k in ('outcome','eventTimestamp','scriptName')}
                          safe['event']={k:event.get(k) for k in ('cron','scheduledTime') if k in event}
                          safe['exceptions']=[{'name':e.get('name'),'message':e.get('message')} for e in d.get('exceptions',[])]
                          safe['scheduler_decisions']=[]
                          for log in d.get('logs',[]):
                              for msg in log.get('message',[]):
                                  try: dec=json.loads(msg)
                                  except (TypeError,json.JSONDecodeError): continue
                                  if isinstance(dec,dict):
                                      safe['scheduler_decisions'].append({k:dec.get(k) for k in ('checked_at','action','status','reason','error','workflow','dispatched','generation_id','trigger_source') if k in dec})
                          s['count']+=1
                          print('RUNTIME_TRACE='+json.dumps(safe),flush=True)
              for s in streams.values():
                  print('RUNTIME_TRACE_SUMMARY='+json.dumps({'worker':s['name'],'connected_banner_seen':s['connected'],'captured_events':s['count']}),flush=True)
          finally:
              for p in processes:
                  if p.poll() is None: p.terminate()
              for p in processes:
                  try: p.wait(timeout=5)
                  except subprocess.TimeoutExpired: p.kill(); p.wait()
          PY
