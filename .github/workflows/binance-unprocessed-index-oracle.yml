name: Binance active receipt index oracle

on:
  pull_request:
    paths:
      - tests/test_hunter_binance_unprocessed_index_oracle.py
      - .github/workflows/binance-unprocessed-index-oracle.yml

permissions:
  contents: read

jobs:
  scratch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fixed SHA
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Bounded unprocessed receipt index plan and full output equivalence
        run: python -B -X utf8 -m unittest -v tests.test_hunter_binance_unprocessed_index_oracle
