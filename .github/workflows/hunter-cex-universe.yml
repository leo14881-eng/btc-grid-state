# Hunter v3 frozen stability baseline: discovery must remain independent of deep research.
name: Hunter Binance Universe Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'
  push:
    branches: [main]
    paths:
      - 'research/hunter_cex_scan.py'
      - 'research/hunter_early_signals.py'
      - 'tests/test_hunter_cex_scan.py'
      - '.github/workflows/hunter-cex-universe.yml'
      - '.github/workflows/hunter-research-pipeline.yml'
permissions:
  contents: write
concurrency:
  group: hunter-discovery-main
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest published baseline
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate discovery only
        run: python -m unittest discover -s tests -p 'test_hunter_cex_scan.py' -v
      - name: Scan Binance USDT spot universe
        run: python research/hunter_cex_scan.py
      - name: Validate publishable discovery generation
        run: |
          python - <<'PY'
          import datetime as dt,json,pathlib
          p=pathlib.Path('research/results/hunter-cex-universe-summary.json')
          d=json.loads(p.read_text())
          assert d.get('binance_complete') is True
          assert d.get('coverage_status')=='BINANCE_COMPLETE'
          assert d.get('generation_id')
          t=dt.datetime.fromisoformat(d['as_of_utc'].replace('Z','+00:00'))
          age=(dt.datetime.now(dt.timezone.utc)-t).total_seconds()
          assert -300 <= age <= 600, age
          print('DISCOVERY_GENERATION_VERIFIED',d['generation_id'],d.get('unique_base_tickers'))
          PY
      - name: Atomically persist discovery outputs only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/hunter-cex-universe-run.json research/results/hunter-cex-universe-latest.json research/results/hunter-cex-universe-summary.json
          git diff --cached --quiet && { echo 'DISCOVERY_NO_CHANGE'; exit 0; }
          git commit -m 'research: publish verified Hunter discovery generation'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "DISCOVERY_PERSISTENCE_VERIFIED attempt=$attempt"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "DISCOVERY_PERSISTENCE_RETRY attempt=$attempt"
            sleep $((attempt * 2))
          done
          echo 'DISCOVERY_PERSISTENCE_FAILURE'
          exit 1

