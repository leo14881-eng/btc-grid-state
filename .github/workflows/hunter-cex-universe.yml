name: Hunter CEX Universe Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hunter_cex_scan.py'
      - 'tests/test_hunter_cex_scan.py'
      - '.github/workflows/hunter-cex-universe.yml'
  schedule:
    - cron: '11 * * * *'
permissions:
  contents: write
concurrency:
  group: hunter-cex-universe-main
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate discovery, pagination and PUMP inclusion
        run: python -m unittest discover -s tests -p 'test_hunter_cex_scan.py' -v
      - name: Scan Binance and Bybit active USDT spot universes
        id: scan
        continue-on-error: true
        run: python research/hunter_cex_scan.py
      - name: Persist coverage, leads and explicit failures
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/hunter-cex-universe-*.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: hourly Hunter CEX universe coverage and candidates'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Mark incomplete venue coverage as failure
        if: steps.scan.outcome != 'success'
        run: exit 2
