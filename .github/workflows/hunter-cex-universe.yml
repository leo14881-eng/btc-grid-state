# Hunter v3 frozen stability baseline: discovery must remain independent of deep research. Final acceptance trigger v2.
name: Hunter Multi-Venue Universe Scan
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  # Any Hunter implementation/workflow/test change must automatically start
  # one complete discovery -> research -> V1/V2 validation cycle. Result-only
  # bot commits are intentionally excluded to avoid recursive runs.
  push:
    branches: [main]
    paths:
      - 'research/*.py'
      - 'research/results/hunter-shadow-rules.json'
      - 'tests/test_hunter*.py'
      - 'tests/test_hunter_bybit_proxy.mjs'
      - 'workers/hunter-bybit-proxy.js'
      - '.github/workflows/bybit-proxy-diagnostic.yml'
      - '.github/workflows/hunter-cex-universe.yml'
      - '.github/hunter-discovery-recovery-trigger'
permissions:
  contents: write
concurrency:
  group: hunter-discovery-main
  cancel-in-progress: false
  queue: max
jobs:
  runtime:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        name: Check authoritative Vultr primary health
        run: |
          git fetch origin main
          git checkout --detach origin/main
          python -m scripts.hunter_runtime_gate discovery
  discovery:
    if: ${{ needs.runtime.outputs.run == 'true' }}
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest published baseline
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate discovery only
        run: |
          python -m unittest discover -s tests -p 'test_hunter_cex_scan.py' -v
          python -m unittest discover -s tests -p 'test_hunter_bybit*.py' -v
          node tests/test_hunter_bybit_proxy.mjs
      - name: Scan Binance and verified Bybit USDT spot universe
        env:
          HUNTER_SOURCE_HEAD_SHA: ${{ github.sha }}
          HUNTER_BYBIT_DIRECT_DISABLED: '1'
          HUNTER_BYBIT_WORKER_MARKET_ENABLED: '1'
        run: python research/hunter_cex_scan.py
      - name: Validate publishable discovery generation
        run: |
          python - <<'PY'
          import datetime as dt,json,pathlib
          p=pathlib.Path('research/results/hunter-cex-universe-summary.json')
          d=json.loads(p.read_text())
          assert d.get('binance_complete') is True
          assert d.get('coverage_status') in ('BINANCE_BYBIT_COMPLETE','BINANCE_BYBIT_SIGNALS_INCOMPLETE','BINANCE_ONLY_BYBIT_UNAVAILABLE')
          assert d.get('required_venues')==['binance','bybit']
          assert d.get('generation_id')
          t=dt.datetime.fromisoformat(d['as_of_utc'].replace('Z','+00:00'))
          age=(dt.datetime.now(dt.timezone.utc)-t).total_seconds()
          assert -300 <= age <= 600, age
          print('DISCOVERY_GENERATION_VERIFIED',d['generation_id'],d.get('unique_base_tickers'))
          PY
      - name: Atomically persist discovery outputs only
        run: python -m scripts.hunter_aux_persist discovery
