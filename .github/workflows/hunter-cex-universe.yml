name: Hunter CEX Universe Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hunter_cex_scan.py'
      - 'tests/test_hunter_cex_scan.py'
      - 'research/hunter_forward_research.py'
      - 'tests/test_hunter_forward_research.py'
      - 'research/hunter_forward_audit.py'
      - 'tests/test_hunter_forward_audit.py'
      - '.github/workflows/hunter-cex-universe.yml'
  schedule:
    - cron: '11 * * * *'
permissions:
  contents: write
concurrency:
  group: hunter-cex-universe-main
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest baseline after serialized queue
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate discovery, pagination and PUMP inclusion
        run: python -m unittest discover -s tests -p 'test_hunter_cex_scan.py' -v
      - name: Validate forward research and evidence gates
        run: python -m unittest discover -s tests -p 'test_hunter_forward_research.py' -v
      - name: Validate point-in-time prospective performance audit
        run: python -m unittest discover -s tests -p 'test_hunter_forward_audit.py' -v
      - name: Scan Binance and Bybit active USDT spot universes
        id: scan
        continue-on-error: true
        run: python research/hunter_cex_scan.py
      - name: Rotate full-universe forward research and enrich selected assets
        id: research
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        run: python research/hunter_forward_research.py
      - name: Freeze discovery snapshots and record actual forward outcomes
        id: audit
        if: steps.research.outcome == 'success'
        continue-on-error: true
        run: python research/hunter_forward_audit.py
      - name: Persist coverage, leads and explicit failures
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research/results/
          git diff --cached --quiet && exit 0
          git commit -m 'research: hourly Hunter CEX universe coverage and candidates'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Fail if verified Binance scan or forward research fails; report Bybit separately
        if: steps.scan.outcome != 'success' || steps.research.outcome != 'success' || steps.audit.outcome != 'success'
        run: exit 2
