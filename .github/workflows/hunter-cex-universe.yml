# Manual verification trigger: 2026-09-26 user-authorized full Hunter v1 rerun
name: Hunter CEX Universe Scan
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hunter_cex_scan.py'
      - 'tests/test_hunter_cex_scan.py'
      - 'research/hunter_forward_research.py'
      - 'tests/test_hunter_forward_research.py'
      - 'research/hunter_forward_audit.py'
      - 'tests/test_hunter_forward_audit.py'
      - 'research/hunter_candidate_dossiers.py'
      - 'tests/test_hunter_candidate_dossiers.py'
      - 'research/hunter-verified-facts.json'
      - 'research/hunter_liquidity_probe.py'
      - 'research/hunter_identity_audit.py'
      - 'tests/test_hunter_identity_audit.py'
      - 'tests/test_hunter_liquidity_probe.py'
      - '.github/workflows/hunter-cex-universe.yml'
  schedule:
    - cron: '11 * * * *'
permissions:
  contents: write
concurrency:
  group: hunter-cex-universe-main
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refresh latest baseline after serialized queue
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate discovery, pagination and PUMP inclusion
        run: python -m unittest discover -s tests -p 'test_hunter_cex_scan.py' -v
      - name: Validate forward research and evidence gates
        run: python -m unittest discover -s tests -p 'test_hunter_forward_research.py' -v
      - name: Validate point-in-time prospective performance audit
        run: python -m unittest discover -s tests -p 'test_hunter_forward_audit.py' -v
      - name: Validate forward candidate dossiers and supply-adjusted scenarios
        run: python -m unittest discover -s tests -p 'test_hunter_candidate_dossiers.py' -v
      - name: Validate token identity collision and asset-type safety
        run: python -m unittest discover -s tests -p 'test_hunter_identity_audit.py' -v
      - name: Validate fresh orderbook evidence and failure isolation
        run: python -m unittest discover -s tests -p 'test_hunter_liquidity_probe.py' -v
      - name: Scan Binance and Bybit active USDT spot universes
        id: scan
        continue-on-error: true
        run: python research/hunter_cex_scan.py
      - name: Rotate full-universe forward research and enrich selected assets
        id: research
        if: steps.scan.outcome == 'success'
        continue-on-error: true
        run: python research/hunter_forward_research.py
      - name: Audit asset types and fail-closed official contract identities
        id: identity
        if: steps.research.outcome == 'success'
        continue-on-error: true
        run: python research/hunter_identity_audit.py
      - name: Freeze discovery snapshots and record actual forward outcomes
        id: audit
        if: steps.research.outcome == 'success'
        continue-on-error: true
        run: python research/hunter_forward_audit.py
      - name: Generate forward candidate dossiers with explicit evidence gaps
        id: dossiers
        if: steps.research.outcome == 'success' && steps.identity.outcome == 'success'
        continue-on-error: true
        run: python research/hunter_candidate_dossiers.py
      - name: Probe current public Binance orderbook for early and continuation lanes
        id: liquidity
        if: steps.dossiers.outcome == 'success'
        continue-on-error: true
        run: python research/hunter_liquidity_probe.py
      - name: Persist coverage, leads and explicit failures
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A research/results/
          git diff --cached --quiet && exit 0
          git commit -m 'research: hourly Hunter CEX universe coverage and candidates'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { echo 'PERSISTENCE_REBASE_CONFLICT'; git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              echo "PERSISTENCE_VERIFIED_PUSH attempt=$attempt"
              exit 0
            fi
            echo "PERSISTENCE_CONCURRENT_UPDATE retry=$attempt"
            sleep $((attempt * 2))
          done
          echo 'PERSISTENCE_FAILURE_AFTER_RETRIES'
          exit 1
      - name: Fail if verified Binance scan or forward research fails; report Bybit separately
        if: steps.scan.outcome != 'success' || steps.research.outcome != 'success' || steps.audit.outcome != 'success' || steps.identity.outcome != 'success' || steps.dossiers.outcome != 'success' || steps.liquidity.outcome != 'success'
        run: exit 2
