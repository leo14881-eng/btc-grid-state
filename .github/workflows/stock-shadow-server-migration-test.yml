name: Stock Server Migration Tests
on:
  pull_request:
    paths:
      - 'research/stock_shadow/**'
      - 'tests/test_stock*.py'
      - '.github/stock-runtime.json'
      - '.github/workflows/stock-shadow*.yml'
      - 'deploy/stock-shadow/**'
  push:
    branches: ['codex/sec-contact-compression-20261010']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Complete stock strategy, migration and acceptance regressions
        run: |
          python -m pytest -v tests/test_stock_shadow.py tests/test_stock_quote_safety.py tests/test_stock_server_migration.py tests/test_stock_scheduler_live_acceptance.py tests/test_stock_cron_control.py
          node --test research/stock_shadow/scheduler/worker.test.mjs
          python -m py_compile research/stock_shadow/server/*.py
          bash -n research/stock_shadow/persist_results.sh
          bash -n deploy/stock-shadow/run-job.sh
      - name: Stock launcher and systemd validation
        run: python -m pytest -q deploy/stock-shadow/test_deployment.py
      - name: Validate explicit shadow-only runtime authority
        run: |
          python - <<'PY'
          from research.stock_shadow.server.runtime import read_config
          c = read_config()
          assert c['owner'] in ('github', 'server', 'paused') and c['epoch'] > 0
          print('STOCK_RUNTIME_VALID', c['owner'], c['epoch'])
          PY
