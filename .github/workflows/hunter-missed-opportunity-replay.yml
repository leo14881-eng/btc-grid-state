name: Hunter Missed Opportunity Replay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hunter_missed_opportunity_replay.py'
      # acceptance-trigger-v3-universe-history
      - '.github/workflows/hunter-missed-opportunity-replay.yml'
  schedule:
    - cron: '55 16 * * *'
permissions:
  contents: write
concurrency:
  group: hunter-missed-opportunity-replay
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        name: Check authoritative Vultr primary health
        run: |
          git fetch origin main
          git checkout --detach origin/main
          python -m scripts.hunter_runtime_gate missed-replay
  replay:
    if: ${{ needs.runtime.outputs.run == 'true' }}
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only missed opportunity replay
        run: python research/hunter_missed_opportunity_replay.py
      - name: Validate replay output
        run: |
          python - <<'PY'
          import json
          p='research/results/hunter-missed-opportunity-replay.json'
          d=json.load(open(p))
          assert d['schema']=='hunter_missed_opportunity_replay_v1'
          assert d['mode']=='READ_ONLY_NO_TRADING'
          assert d['rows'], 'REPLAY_ROWS_EMPTY'
          assert all('early' in x and 'v1' in x and 'capital_review' in x and 'v2' in x and 'post_detection' in x for x in d['rows'])
          print('MISSED_OPPORTUNITY_REPLAY_ACCEPTED',len(d['rows']))
          PY
      - name: Persist replay only
        run: python -m scripts.hunter_aux_persist missed-replay
