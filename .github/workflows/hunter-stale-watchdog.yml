name: Hunter Stale-Result Watchdog
on:
  workflow_dispatch:
    inputs:
      simulate_stale:
        description: 'Test stale detection and recovery decision without dispatching producer'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/hunter-stale-watchdog.yml'
  schedule:
    - cron: '37 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: hunter-watchdog-main
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Detect stale committed Hunter results
        id: stale
        env:
          SIMULATE_STALE: ${{ github.event_name == 'push' || inputs.simulate_stale || 'false' }}
        run: |
          python - <<'PY'
          import json,datetime,os
          p='research/results/hunter-cex-universe-summary.json'
          try:
              d=json.load(open(p))
              t=datetime.datetime.fromisoformat(d['as_of_utc'].replace('Z','+00:00'))
              age=(datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()/60
          except Exception as e:
              print('HUNTER_RESULT_INVALID',repr(e))
              age=float('inf')
          print('HUNTER_RESULT_AGE_MINUTES',age)
          stale=age>90 or age < -5 or os.environ['SIMULATE_STALE']=='true'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('stale='+str(stale).lower(),file=f)
          PY
      - name: Inspect producer runs and safely recover
        if: steps.stale.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'push' || inputs.simulate_stale || 'false' }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" --jq '{workflow_runs: [.workflow_runs[] | {path,head_branch,status,event,created_at}]}')
          export RUNS_JSON="$runs"
          decision=$(python - <<'PY'
          import json,os,datetime
          runs=json.loads(os.environ['RUNS_JSON'])['workflow_runs']
          producer=[r for r in runs if r.get('path')=='.github/workflows/hunter-cex-universe.yml' and r.get('head_branch')=='main']
          active={'queued','in_progress','waiting','requested','pending'}
          now=datetime.datetime.now(datetime.timezone.utc)
          if any(r['status'] in active for r in producer):
              print('ACTIVE')
          elif any(r.get('event')=='workflow_dispatch' and
                   (now-datetime.datetime.fromisoformat(r['created_at'].replace('Z','+00:00'))).total_seconds()<3600
                   for r in producer):
              print('COOLDOWN')
          else:
              print('DISPATCH')
          PY
          )
          echo "HUNTER_RECOVERY_DECISION=$decision"
          if [ "$DRY_RUN" = true ]; then
            echo "HUNTER_DRY_RUN_VERIFIED: no producer dispatch"
            exit 0
          fi
          case "$decision" in
            ACTIVE) echo 'HUNTER_STALE_ACTIVE_PRODUCER'; exit 1 ;;
            COOLDOWN) echo 'HUNTER_STALE_RECOVERY_COOLDOWN'; exit 1 ;;
            DISPATCH)
              gh workflow run hunter-cex-universe.yml --ref main
              echo 'HUNTER_RECOVERY_DISPATCHED; pending producer outcome verification'
              exit 1 ;;
            *) echo 'HUNTER_RECOVERY_DECISION_INVALID'; exit 1 ;;
          esac
      - name: Normal freshness proof
        if: steps.stale.outputs.stale == 'false'
        run: echo 'HUNTER_WATCHDOG_FRESH'
