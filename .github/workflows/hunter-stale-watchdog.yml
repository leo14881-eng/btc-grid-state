name: Hunter Stale-Result Watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '07,37 * * * *'
permissions:
  contents: read
concurrency:
  group: hunter-watchdog-main
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Observe discovery and downstream generation
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git show origin/main:research/results/hunter-cex-universe-summary.json > "$RUNNER_TEMP/scan.json"
          git show origin/main:research/results/hunter-health-and-queue.json > "$RUNNER_TEMP/health.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/health.json"
          python - <<'PY'
          import json,datetime,os
          scan=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'scan.json')))
          health=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'health.json')))
          t=datetime.datetime.fromisoformat(scan['as_of_utc'].replace('Z','+00:00'))
          age=(datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()/60
          fresh=(-5 <= age <= 70 and scan.get('binance_complete') is True)
          aligned=(health.get('scan_generation_id')==scan.get('generation_id') or health.get('scan_as_of_utc')==scan.get('as_of_utc'))
          print(f"HUNTER_WATCHDOG_STATE generation={scan.get('generation_id')} age_minutes={age:.2f} discovery_fresh={fresh} downstream_aligned={aligned}")
          if not fresh:
              print('HUNTER_WATCHDOG_ALERT DISCOVERY_STALE')
          if not aligned:
              print('HUNTER_WATCHDOG_ALERT DOWNSTREAM_NOT_ALIGNED')
          # Observer only. Recovery is intentionally not dispatched here:
          # the scheduled Universe is the single discovery producer and its
          # successful workflow_run is the single Research trigger.
          print('HUNTER_WATCHDOG_OBSERVER_ONLY')
          PY
