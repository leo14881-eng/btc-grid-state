name: Hunter Stale-Result Watchdog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hunter-stale-watchdog.yml'
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: hunter-watchdog-main
  cancel-in-progress: false
jobs:
  runtime:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        name: Check authoritative Vultr primary health
        run: |
          git fetch origin main
          git checkout --detach origin/main
          python -m scripts.hunter_runtime_gate watchdog
  check:
    if: ${{ needs.runtime.outputs.run == 'true' }}
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Observe discovery and downstream generation
        id: observe
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          git show origin/main:research/results/hunter-cex-universe-summary.json > "$RUNNER_TEMP/scan.json"
          git show origin/main:research/results/hunter-health-and-queue.json > "$RUNNER_TEMP/health.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/health.json"
          git show origin/main:research/results/hunter-position-monitor.json > "$RUNNER_TEMP/monitor.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/monitor.json"
          python - <<'PY'
          import json,datetime,os
          scan=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'scan.json')))
          health=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'health.json')))
          monitor=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'monitor.json')))
          now=datetime.datetime.now(datetime.timezone.utc)
          def age_minutes(value):
              try:
                  stamp=datetime.datetime.fromisoformat(value.replace('Z','+00:00'))
                  return (now-stamp).total_seconds()/60
              except (AttributeError,TypeError,ValueError):
                  return float('inf')
          age=age_minutes(scan.get('as_of_utc'))
          monitor_age=age_minutes(monitor.get('as_of_utc'))
          fresh=(-5 <= age <= 70 and scan.get('binance_complete') is True)
          monitor_fresh=(-5 <= monitor_age <= 25)
          aligned=bool(scan.get('generation_id')) and health.get('scan_generation_id')==scan.get('generation_id')
          # Allow the workflow_run research pipeline time to publish its snapshot.
          downstream_stale=not aligned and age > 25
          print(f"HUNTER_WATCHDOG_STATE generation={scan.get('generation_id')} age_minutes={age:.2f} discovery_fresh={fresh} downstream_aligned={aligned} monitor_age_minutes={monitor_age:.2f} monitor_fresh={monitor_fresh}")
          stale = not fresh
          if stale:
              print('HUNTER_WATCHDOG_ALERT DISCOVERY_STALE')
          if not aligned:
              print('HUNTER_WATCHDOG_ALERT DOWNSTREAM_NOT_ALIGNED')
          if not monitor_fresh:
              print('HUNTER_WATCHDOG_ALERT POSITION_MONITOR_STALE')
          out=os.environ.get('GITHUB_OUTPUT')
          if out:
              with open(out,'a') as fh:
                  print('discovery_stale='+('true' if stale else 'false'), file=fh)
                  print('downstream_stale='+('true' if downstream_stale else 'false'), file=fh)
                  print('monitor_stale='+('true' if not monitor_fresh else 'false'), file=fh)
          print('HUNTER_WATCHDOG_SELF_HEAL_ARMED')
          PY
      - name: Self-heal stale discovery or downstream by touching dedicated trigger
        if: ${{ steps.observe.outputs.discovery_stale == 'true' || steps.observe.outputs.downstream_stale == 'true' }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/hunter-discovery-recovery-trigger
          git add .github/hunter-discovery-recovery-trigger
          git commit -m 'ops: self-heal stale Hunter discovery'
          git push origin HEAD:main
          echo 'HUNTER_WATCHDOG_RECOVERY_TRIGGER_PUSHED'
      - name: Self-heal stale position monitor by touching dedicated trigger
        if: ${{ steps.observe.outputs.monitor_stale == 'true' }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/hunter-position-monitor-trigger
          git add .github/hunter-position-monitor-trigger
          git commit -m 'ops: self-heal stale Hunter position monitor'
          git push origin HEAD:main
          echo 'HUNTER_WATCHDOG_MONITOR_RECOVERY_TRIGGER_PUSHED'

      # GITHUB_TOKEN pushes are not a reliable downstream workflow trigger.
      # GitHub-hosted recovery uses workflow_dispatch; the Vultr local runner
      # skips these uses: steps and performs its own systemd recovery above.
      - name: Dispatch stale discovery workflow explicitly
        if: ${{ steps.observe.outputs.discovery_stale == 'true' || steps.observe.outputs.downstream_stale == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "hunter-cex-universe.yml",
              ref: "main"
            });
            core.info("HUNTER_WATCHDOG_DISCOVERY_DISPATCHED");

      - name: Dispatch stale position monitor explicitly
        if: ${{ steps.observe.outputs.monitor_stale == 'true' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "hunter-position-monitor.yml",
              ref: "main",
              inputs: { trigger_source: "watchdog" }
            });
            core.info("HUNTER_WATCHDOG_MONITOR_DISPATCHED");

      # A workflow-file change is rare; use it to smoke-test the complete
      # GITHUB_TOKEN workflow_dispatch -> discovery -> research chain once.
      - name: Smoke-test downstream dispatch after watchdog workflow changes
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            if (context.eventName !== "push") {
              core.info("No workflow-change smoke test on scheduled/manual runs");
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "hunter-cex-universe.yml",
              per_page: 10
            });
            const recentManual = data.workflow_runs.find(
              run => run.event === "workflow_dispatch" &&
                Date.now() - Date.parse(run.created_at) < 60 * 1000
            );
            if (recentManual) {
              core.info("Skip smoke dispatch; a recent watchdog discovery is already running");
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "hunter-cex-universe.yml",
              ref: "main"
            });
            core.info("HUNTER_WATCHDOG_CONFIG_CHANGE_SMOKE_DISPATCHED");