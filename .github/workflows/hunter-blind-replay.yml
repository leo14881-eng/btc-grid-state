name: Hunter Blind Replay

on:
  workflow_dispatch:
  schedule:
    - cron: '31 * * * *'
  push:
    branches: [main]
    paths:
      - 'research/hunter_blind_replay.py'
      - '.github/workflows/hunter-blind-replay.yml'

permissions:
  contents: write

concurrency:
  group: hunter-blind-replay
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        name: Check authoritative Vultr primary health
        run: |
          git fetch origin main
          git checkout --detach origin/main
          python -m scripts.hunter_runtime_gate blind-replay
  replay:
    needs: runtime
    if: ${{ needs.runtime.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh latest main baseline
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize Binance archive timestamps
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/hunter_blind_replay.py')
          s=p.read_text()
          old='out.append({"t":int(r[0]),"o":float(r[1]),"h":float(r[2]),"l":float(r[3]),"c":float(r[4]),'
          new='ts=int(r[0]); ts=ts//1000 if ts>10**14 else ts\n            out.append({"t":ts,"o":float(r[1]),"h":float(r[2]),"l":float(r[3]),"c":float(r[4]),'
          if old not in s: raise SystemExit('timestamp patch target missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Run blind replay
        run: python research/hunter_blind_replay.py
      - name: Persist replay outputs from clean latest main
        run: python -m scripts.hunter_aux_persist blind-replay
