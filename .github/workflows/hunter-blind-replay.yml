name: Hunter Blind Replay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hunter_blind_replay.py'
      - '.github/workflows/hunter-blind-replay.yml'

permissions:
  contents: write

concurrency:
  group: hunter-blind-replay
  cancel-in-progress: false

jobs:
  replay:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run blind replay
        run: python research/hunter_blind_replay.py
      - name: Commit research results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/hunter-blind-replay-summary.json research/results/hunter-blind-replay-events.csv research/results/hunter-blind-replay-controls.csv hunter-replay-v1.json || true
          git diff --cached --quiet && exit 0
          git commit -m "research: hunter blind replay results"
          git push
