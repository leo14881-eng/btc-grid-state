name: Hunter Blind Replay

on:
  workflow_dispatch:
  schedule:
    - cron: '31 * * * *'
  push:
    branches: [main]
    paths:
      - 'research/hunter_blind_replay.py'
      - '.github/workflows/hunter-blind-replay.yml'

permissions:
  contents: write

concurrency:
  group: hunter-blind-replay
  cancel-in-progress: false

jobs:
  replay:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.actor != 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh latest main baseline
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize Binance archive timestamps
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/hunter_blind_replay.py')
          s=p.read_text()
          old='out.append({"t":int(r[0]),"o":float(r[1]),"h":float(r[2]),"l":float(r[3]),"c":float(r[4]),'
          new='ts=int(r[0]); ts=ts//1000 if ts>10**14 else ts\n            out.append({"t":ts,"o":float(r[1]),"h":float(r[2]),"l":float(r[3]),"c":float(r[4]),'
          if old not in s: raise SystemExit('timestamp patch target missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Run blind replay
        run: python research/hunter_blind_replay.py
      - name: Persist replay outputs from clean latest main
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          outdir="$RUNNER_TEMP/replay-output"
          rm -rf "$outdir"
          mkdir -p "$outdir/research/results"
          for f in \
            research/results/hunter-blind-replay-summary.json \
            research/results/hunter-blind-replay-events.csv \
            research/results/hunter-blind-replay-controls.csv \
            research/results/hunter-archive-symbol-manifest.json \
            hunter-replay-v1.json
          do
            [ -f "$f" ] || continue
            mkdir -p "$outdir/$(dirname "$f")"
            cp "$f" "$outdir/$f"
          done

          # Replay patches the Python source only inside the runner. Never let that
          # unstaged working-tree modification participate in persistence.
          git reset --hard HEAD
          git clean -fd

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B replay-persist origin/main
            for f in \
              research/results/hunter-blind-replay-summary.json \
              research/results/hunter-blind-replay-events.csv \
              research/results/hunter-blind-replay-controls.csv \
              research/results/hunter-archive-symbol-manifest.json \
              hunter-replay-v1.json
            do
              [ -f "$outdir/$f" ] || continue
              mkdir -p "$(dirname "$f")"
              cp "$outdir/$f" "$f"
            done
            git add research/results/hunter-blind-replay-summary.json research/results/hunter-blind-replay-events.csv research/results/hunter-blind-replay-controls.csv research/results/hunter-archive-symbol-manifest.json hunter-replay-v1.json || true
            if git diff --cached --quiet; then
              echo 'REPLAY_NO_CHANGE'
              exit 0
            fi
            git commit -m "research: hunter blind replay results"
            if git push origin HEAD:main; then
              echo "REPLAY_PERSISTENCE_VERIFIED attempt=$attempt"
              exit 0
            fi
            git reset --hard
            sleep $((attempt * 2))
          done
          echo 'REPLAY_PERSISTENCE_FAILURE'
          exit 1
