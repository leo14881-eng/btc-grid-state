name: Binance JSON owned-copy strict oracle

on:
  pull_request:
    paths:
      - research/hunter_binance_stream_consumer.py
      - tests/test_hunter_binance_snapshot_copy.py
      - .github/workflows/binance-owned-json-oracle.yml

permissions:
  contents: read

jobs:
  owned-json:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Exact byte equality, mutability isolation, cycles, aliases and live fences
        run: |
          python -B -X utf8 -m unittest -v \
            tests.test_hunter_binance_snapshot_copy \
            tests.test_hunter_binance_consumer_fence \
            tests.test_hunter_binance_signal_use \
            tests.test_hunter_binance_revision_copy \
            tests.test_hunter_binance_coordinated_runtime
