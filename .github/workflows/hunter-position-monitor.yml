name: Hunter 5m Position Monitor
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Infrastructure trigger source only'
        required: false
        default: 'manual'
  push:
    branches: [main]
    paths:
      - 'research/hunter_policy.py'
      - 'research/results/hunter-shadow-rules.json'
      - 'research/hunter_position_monitor.py'
      - 'research/hunter_scheduler_health.py'
      - 'research/hunter_cex_scan.py'
      - 'research/hunter_shadow_trader_v2.py'
      - 'research/hunter_tail_risk.py'
      - 'research/hunter_leading_risk.py'
      - 'tests/test_hunter_position_monitor.py'
      - 'tests/test_hunter_scheduler_health.py'
      - 'tests/test_hunter_tail_risk.py'
      - 'tests/test_hunter_leading_risk.py'
      - 'tests/test_hunter_shadow_trader_v2.py'
      - '.github/workflows/hunter-position-monitor.yml'
      - '.github/hunter-position-monitor-trigger'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: hunter-shadow-state
  cancel-in-progress: false
  queue: max
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh authoritative shadow state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Verified Vultr primary or GitHub fallback gate
        id: runtime
        run: python -m scripts.hunter_monitor_runtime gate
      - name: Generation idempotency gate
        if: steps.runtime.outputs.run == 'true'
        id: generation
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          RESULT=$(python -m research.hunter_scheduler_health gate)
          echo "$RESULT"
          PROCESS=$(python -c "import json,sys; print(str(json.load(sys.stdin)['process']).lower())" <<<"$RESULT")
          GENERATION=$(python -c "import json,sys; print(json.load(sys.stdin)['generation_id'])" <<<"$RESULT")
          echo "process=$PROCESS" >> "$GITHUB_OUTPUT"
          echo "generation_id=$GENERATION" >> "$GITHUB_OUTPUT"
          echo "trigger_source=$TRIGGER_SOURCE" >> "$GITHUB_OUTPUT"
      - name: Test shared decision engine and fast position monitor
        if: steps.generation.outputs.process == 'true'
        run: |
          python -m unittest tests.test_hunter_shadow_trader_v2 tests.test_hunter_position_monitor tests.test_hunter_tail_risk tests.test_hunter_leading_risk -v
      - name: Fast monitor V1 and V2 open positions only
        if: steps.generation.outputs.process == 'true'
        run: python -m research.hunter_position_monitor
      - name: Validate state
        if: steps.generation.outputs.process == 'true'
        run: |
          python - <<'PY'
          import json
          for p in ['research/results/hunter-shadow-portfolio.json','research/results/hunter-shadow-v2-portfolio.json']:
              raw=open(p).read().strip()
              assert raw, f'EMPTY_PORTFOLIO_FORBIDDEN {p}'
              d=json.loads(raw); names=[x.get('asset') for x in d.get('open_positions') or []]
              assert d.get('schema')=='hunter_shadow_v2_portfolio_v2', f'INVALID_PORTFOLIO_SCHEMA {p}'
              assert len(names)==len(set(names)), f'DUPLICATE_OPEN {p}'
              assert d.get('mode')=='SIMULATION_ONLY_NO_REAL_ORDERS'
          for portfolio,summary in [
              ('research/results/hunter-shadow-portfolio.json','research/results/hunter-shadow-summary.json'),
              ('research/results/hunter-shadow-v2-portfolio.json','research/results/hunter-shadow-v2-summary.json')]:
              st=json.load(open(portfolio)); sm=json.load(open(summary))
              assert int(sm.get('open_positions') or 0)==len(st.get('open_positions') or []), f'SUMMARY_OPEN_MISMATCH {summary}'
              assert int(sm.get('closed_positions') or 0)==len(st.get('closed_positions') or []), f'SUMMARY_CLOSED_MISMATCH {summary}'
              assert sm.get('as_of_utc')==st.get('updated_at_utc'), f'SUMMARY_REVISION_MISMATCH {summary}'
          m=json.load(open('research/results/hunter-position-monitor.json'))
          lr=json.load(open('research/results/hunter-leading-risk.json'))
          assert lr.get('capital_authority')=='NONE_SHADOW_ONLY'
          assert lr.get('shadow_only') is True and lr.get('real_position_mutation') is False
          assert (lr.get('current') or {}).get('level') in ('NORMAL','WATCH','PRE_CRASH_1','PRE_CRASH_2','PRE_CRASH_3')
          assert m.get('batch_endpoint')=='/api/v3/ticker/24hr' or m.get('status')=='NO_OPEN_POSITIONS'
          lanes={x.get('lane'):x for x in m.get('results') or []}
          for lane,p in [('SHADOW_V1','research/results/hunter-shadow-portfolio.json'),('SHADOW_V2','research/results/hunter-shadow-v2-portfolio.json')]:
              raw=open(p).read().strip()
              if not raw: continue
              d=json.loads(raw)
              assert lane in lanes, f'MONITOR_LANE_MISSING {lane}'
              assert int(lanes[lane].get('open') or 0)==len(d.get('open_positions') or []), f'MONITOR_OPEN_MISMATCH {lane}'
          print('FAST_POSITION_MONITOR_OK')
          PY
      - name: Mark successful generation for atomic persistence
        if: steps.generation.outputs.process == 'true'
        env:
          MONITOR_STARTED_AT: ${{ steps.generation.outputs.started_at }}
          TRIGGER_SOURCE: ${{ steps.generation.outputs.trigger_source }}
          ADMITTED_GENERATION: ${{ steps.generation.outputs.generation_id }}
        run: |
          python -m research.hunter_scheduler_health success --started-at "$MONITOR_STARTED_AT" --trigger-source "$TRIGGER_SOURCE" --state-revision "$(git rev-parse HEAD)"
          python - <<'PYGEN'
          import json,os,pathlib
          p=pathlib.Path('research/results/hunter-scheduler-health.json')
          h=json.loads(p.read_text())
          h['current_generation_id']=h['last_successful_monitor_generation_id']=os.environ['ADMITTED_GENERATION']
          p.write_text(json.dumps(h,indent=2,sort_keys=True)+'\n')
          PYGEN
      - name: Persist monitored shadow state
        if: steps.generation.outputs.process == 'true'
        env:
          ADMITTED_GENERATION: ${{ steps.generation.outputs.generation_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m scripts.hunter_monitor_persist persist --base "$(git rev-parse HEAD)" --generation "$ADMITTED_GENERATION"
