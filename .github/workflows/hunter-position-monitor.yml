name: Hunter 5m Position Monitor
on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Infrastructure trigger source only'
        required: false
        default: 'manual'
  push:
    branches: [main]
    paths:
      - 'research/hunter_policy.py'
      - 'research/results/hunter-shadow-rules.json'
      - 'research/hunter_position_monitor.py'
      - 'research/hunter_cex_scan.py'
      - 'research/hunter_shadow_trader_v2.py'
      - 'research/hunter_tail_risk.py'
      - 'research/hunter_leading_risk.py'
      - 'tests/test_hunter_position_monitor.py'
      - 'tests/test_hunter_tail_risk.py'
      - 'tests/test_hunter_leading_risk.py'
      - 'tests/test_hunter_shadow_trader_v2.py'
      - '.github/workflows/hunter-position-monitor.yml'
      - '.github/hunter-position-monitor-trigger'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: hunter-shadow-state
  cancel-in-progress: false
  queue: max
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh authoritative shadow state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Generation idempotency gate
        id: generation
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          RESULT=$(python -m research.hunter_scheduler_health gate)
          echo "$RESULT"
          PROCESS=$(python -c "import json,sys; print(str(json.load(sys.stdin)['process']).lower())" <<<"$RESULT")
          GENERATION=$(python -c "import json,sys; print(json.load(sys.stdin)['generation_id'])" <<<"$RESULT")
          echo "process=$PROCESS" >> "$GITHUB_OUTPUT"
          echo "generation_id=$GENERATION" >> "$GITHUB_OUTPUT"
          echo "trigger_source=$TRIGGER_SOURCE" >> "$GITHUB_OUTPUT"
      - name: Test shared decision engine and fast position monitor
        if: steps.generation.outputs.process == 'true'
        run: |
          python -m unittest tests.test_hunter_shadow_trader_v2 tests.test_hunter_position_monitor tests.test_hunter_tail_risk tests.test_hunter_leading_risk -v
      - name: Fast monitor V1 and V2 open positions only
        if: steps.generation.outputs.process == 'true'
        run: python -m research.hunter_position_monitor
      - name: Validate state
        if: steps.generation.outputs.process == 'true'
        run: |
          python - <<'PY'
          import json
          for p in ['research/results/hunter-shadow-portfolio.json','research/results/hunter-shadow-v2-portfolio.json']:
              raw=open(p).read().strip()
              assert raw, f'EMPTY_PORTFOLIO_FORBIDDEN {p}'
              d=json.loads(raw); names=[x.get('asset') for x in d.get('open_positions') or []]
              assert d.get('schema')=='hunter_shadow_v2_portfolio_v2', f'INVALID_PORTFOLIO_SCHEMA {p}'
              assert len(names)==len(set(names)), f'DUPLICATE_OPEN {p}'
              assert d.get('mode')=='SIMULATION_ONLY_NO_REAL_ORDERS'
          for portfolio,summary in [
              ('research/results/hunter-shadow-portfolio.json','research/results/hunter-shadow-summary.json'),
              ('research/results/hunter-shadow-v2-portfolio.json','research/results/hunter-shadow-v2-summary.json')]:
              st=json.load(open(portfolio)); sm=json.load(open(summary))
              assert int(sm.get('open_positions') or 0)==len(st.get('open_positions') or []), f'SUMMARY_OPEN_MISMATCH {summary}'
              assert int(sm.get('closed_positions') or 0)==len(st.get('closed_positions') or []), f'SUMMARY_CLOSED_MISMATCH {summary}'
              assert sm.get('as_of_utc')==st.get('updated_at_utc'), f'SUMMARY_REVISION_MISMATCH {summary}'
          m=json.load(open('research/results/hunter-position-monitor.json'))
          lr=json.load(open('research/results/hunter-leading-risk.json'))
          assert lr.get('capital_authority')=='NONE_SHADOW_ONLY'
          assert lr.get('shadow_only') is True and lr.get('real_position_mutation') is False
          assert (lr.get('current') or {}).get('level') in ('NORMAL','WATCH','PRE_CRASH_1','PRE_CRASH_2','PRE_CRASH_3')
          assert m.get('batch_endpoint')=='/api/v3/ticker/24hr' or m.get('status')=='NO_OPEN_POSITIONS'
          lanes={x.get('lane'):x for x in m.get('results') or []}
          for lane,p in [('SHADOW_V1','research/results/hunter-shadow-portfolio.json'),('SHADOW_V2','research/results/hunter-shadow-v2-portfolio.json')]:
              raw=open(p).read().strip()
              if not raw: continue
              d=json.loads(raw)
              assert lane in lanes, f'MONITOR_LANE_MISSING {lane}'
              assert int(lanes[lane].get('open') or 0)==len(d.get('open_positions') or []), f'MONITOR_OPEN_MISMATCH {lane}'
          print('FAST_POSITION_MONITOR_OK')
          PY
      - name: Mark successful generation for atomic persistence
        if: steps.generation.outputs.process == 'true'
        env:
          MONITOR_STARTED_AT: ${{ steps.generation.outputs.started_at }}
          TRIGGER_SOURCE: ${{ steps.generation.outputs.trigger_source }}
        run: |
          python -m research.hunter_scheduler_health success --started-at "$MONITOR_STARTED_AT" --trigger-source "$TRIGGER_SOURCE" --state-revision "$(git rev-parse HEAD)"
      - name: Persist monitored shadow state
        if: steps.generation.outputs.process == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BASE_SHA=$(git rev-parse HEAD)
          git fetch origin main
          CHANGED=$(git diff --name-only "$BASE_SHA"..origin/main || true)
          if printf '%s\n' "$CHANGED" | grep -Eq '^(research/hunter_policy\.py|research/results/hunter-shadow-rules\.json|research/hunter_(shadow_trader|shadow_trader_v2|position_monitor|tail_risk|leading_risk)\.py|research/results/hunter-(shadow-portfolio|shadow-v2-portfolio|shadow-summary|shadow-v2-summary|position-monitor|leading-risk)\.json|\.github/workflows/hunter-position-monitor\.yml)'; then
            echo "SHADOW_STATE_REVISION_CONFLICT"
            printf '%s\n' "$CHANGED"
            exit 1
          fi
          git add -f research/results/hunter-position-monitor.json research/results/hunter-leading-risk.json research/results/hunter-shadow-summary.json research/results/hunter-shadow-v2-summary.json research/results/hunter-scheduler-health.json
          for p in research/results/hunter-shadow-portfolio.json research/results/hunter-shadow-v2-portfolio.json; do
            [ -s "$p" ] || { echo "REFUSE_EMPTY_PORTFOLIO $p"; exit 1; }
            python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('schema')=='hunter_shadow_v2_portfolio_v2'; assert d.get('mode')=='SIMULATION_ONLY_NO_REAL_ORDERS'" "$p"
            git add -f "$p"
          done
          verify_main () {
            git fetch origin main
            for p in research/results/hunter-shadow-portfolio.json research/results/hunter-shadow-v2-portfolio.json research/results/hunter-shadow-summary.json research/results/hunter-shadow-v2-summary.json research/results/hunter-position-monitor.json research/results/hunter-scheduler-health.json; do
              git show "origin/main:$p" > "/tmp/$(basename "$p")"
              [ -s "/tmp/$(basename "$p")" ] || { echo "POST_PUSH_EMPTY $p"; return 1; }
              python -c "import json,sys; json.load(open(sys.argv[1]))" "/tmp/$(basename "$p")" || return 1
            done
            python -c "import json; v1=json.load(open('/tmp/hunter-shadow-portfolio.json')); v2=json.load(open('/tmp/hunter-shadow-v2-portfolio.json')); s1=json.load(open('/tmp/hunter-shadow-summary.json')); s2=json.load(open('/tmp/hunter-shadow-v2-summary.json')); m=json.load(open('/tmp/hunter-position-monitor.json')); lanes={x.get('lane'):x for x in m.get('results') or []}; assert lanes['SHADOW_V1']['open']==len(v1.get('open_positions') or []); assert lanes['SHADOW_V2']['open']==len(v2.get('open_positions') or []); assert s1.get('open_positions')==len(v1.get('open_positions') or []) and s1.get('closed_positions')==len(v1.get('closed_positions') or []); assert s2.get('open_positions')==len(v2.get('open_positions') or []) and s2.get('closed_positions')==len(v2.get('closed_positions') or []); assert s1.get('as_of_utc')==v1.get('updated_at_utc') and s2.get('as_of_utc')==v2.get('updated_at_utc'); h=json.load(open('/tmp/hunter-scheduler-health.json')); assert h.get('last_successful_monitor_generation_id')==h.get('current_generation_id'); assert h.get('shadow_only') is True and h.get('real_order_count')==0; print('POST_PUSH_SHADOW_STATE_VERIFIED',lanes['SHADOW_V1']['open'],lanes['SHADOW_V2']['open'],h.get('current_generation_id'))"
          }
          if git diff --cached --quiet; then
            echo NO_POSITION_STATE_CHANGE
            verify_main
            exit $?
          fi
          git commit -m 'state: five-minute Hunter position monitor'
          git fetch origin main
          BASE_PARENT=$(git rev-parse HEAD^)
          CHANGED=$(git diff --name-only "$BASE_PARENT"..origin/main || true)
          if printf '%s\n' "$CHANGED" | grep -Eq '^(research/hunter_policy\.py|research/results/hunter-shadow-rules\.json|research/hunter_(shadow_trader|shadow_trader_v2|position_monitor|tail_risk|leading_risk)\.py|research/results/hunter-(shadow-portfolio|shadow-v2-portfolio|shadow-summary|shadow-v2-summary|position-monitor|leading-risk)\.json|\.github/workflows/hunter-position-monitor\.yml)'; then
            echo "SHADOW_STATE_REVISION_CHANGED_BEFORE_PUSH"
            printf '%s\n' "$CHANGED"
            exit 1
          fi
          git rebase origin/main
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "SHADOW_STATE_PUSH_VERIFIED attempt=$attempt"
              verify_main
              exit $?
            fi
            echo "SHADOW_STATE_PUSH_RACE attempt=$attempt"
            PRE_REBASE_PARENT=$(git rev-parse HEAD^)
            git fetch origin main
            CHANGED=$(git diff --name-only "$PRE_REBASE_PARENT"..origin/main || true)
            if printf '%s\n' "$CHANGED" | grep -Eq '^(research/hunter_policy\.py|research/results/hunter-shadow-rules\.json|research/hunter_(shadow_trader|shadow_trader_v2|position_monitor|tail_risk|leading_risk)\.py|research/results/hunter-(shadow-portfolio|shadow-v2-portfolio|shadow-summary|shadow-v2-summary|position-monitor|leading-risk)\.json|\.github/workflows/hunter-position-monitor\.yml)'; then
              echo "SHADOW_STATE_CAS_REJECTED_STALE_WRITER"
              printf '%s\n' "$CHANGED"
              exit 1
            fi
            git rebase origin/main
            sleep $attempt
          done
          echo "SHADOW_STATE_PUSH_RETRY_EXHAUSTED"
          exit 1
