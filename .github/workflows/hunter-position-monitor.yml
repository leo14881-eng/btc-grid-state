name: Hunter 5m Position Monitor
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hunter_position_monitor.py'
      - 'research/hunter_cex_scan.py'
      - 'research/hunter_shadow_trader_v2.py'
      - 'tests/test_hunter_position_monitor.py'
      - 'tests/test_hunter_shadow_trader_v2.py'
      - '.github/workflows/hunter-position-monitor.yml'
      - '.github/hunter-position-monitor-trigger'
  workflow_run:
    workflows: ['Hunter Potential Research Pipeline']
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: hunter-shadow-state
  cancel-in-progress: false
  queue: max
jobs:
  monitor:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh authoritative shadow state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Test shared decision engine and fast position monitor
        run: |
          python -m unittest tests.test_hunter_shadow_trader_v2 tests.test_hunter_position_monitor -v
      - name: Fast monitor V1 and V2 open positions only
        run: python -m research.hunter_position_monitor
      - name: Validate state
        run: |
          python - <<'PY'
          import json
          for p in ['research/results/hunter-shadow-portfolio.json','research/results/hunter-shadow-v2-portfolio.json']:
              raw=open(p).read().strip()
              assert raw, f'EMPTY_PORTFOLIO_FORBIDDEN {p}'
              d=json.loads(raw); names=[x.get('asset') for x in d.get('open_positions') or []]
              assert d.get('schema')=='hunter_shadow_v2_portfolio_v2', f'INVALID_PORTFOLIO_SCHEMA {p}'
              assert len(names)==len(set(names)), f'DUPLICATE_OPEN {p}'
              assert d.get('mode')=='SIMULATION_ONLY_NO_REAL_ORDERS'
          for portfolio,summary in [
              ('research/results/hunter-shadow-portfolio.json','research/results/hunter-shadow-summary.json'),
              ('research/results/hunter-shadow-v2-portfolio.json','research/results/hunter-shadow-v2-summary.json')]:
              st=json.load(open(portfolio)); sm=json.load(open(summary))
              assert int(sm.get('open_positions') or 0)==len(st.get('open_positions') or []), f'SUMMARY_OPEN_MISMATCH {summary}'
              assert int(sm.get('closed_positions') or 0)==len(st.get('closed_positions') or []), f'SUMMARY_CLOSED_MISMATCH {summary}'
              assert sm.get('as_of_utc')==st.get('updated_at_utc'), f'SUMMARY_REVISION_MISMATCH {summary}'
          m=json.load(open('research/results/hunter-position-monitor.json'))
          assert m.get('batch_endpoint')=='/api/v3/ticker/24hr' or m.get('status')=='NO_OPEN_POSITIONS'
          lanes={x.get('lane'):x for x in m.get('results') or []}
          for lane,p in [('SHADOW_V1','research/results/hunter-shadow-portfolio.json'),('SHADOW_V2','research/results/hunter-shadow-v2-portfolio.json')]:
              raw=open(p).read().strip()
              if not raw: continue
              d=json.loads(raw)
              assert lane in lanes, f'MONITOR_LANE_MISSING {lane}'
              assert int(lanes[lane].get('open') or 0)==len(d.get('open_positions') or []), f'MONITOR_OPEN_MISMATCH {lane}'
          print('FAST_POSITION_MONITOR_OK')
          PY
      - name: Persist monitored shadow state
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          BASE_SHA=$(git rev-parse HEAD)
          git fetch origin main
          CHANGED=$(git diff --name-only "$BASE_SHA"..origin/main || true)
          if printf '%s\n' "$CHANGED" | grep -Eq '^(research/hunter|research/results/hunter-|\.github/workflows/hunter-)'; then
            echo "SHADOW_STATE_REVISION_CONFLICT"
            printf '%s\n' "$CHANGED"
            exit 1
          fi
          git add -f research/results/hunter-position-monitor.json research/results/hunter-shadow-summary.json research/results/hunter-shadow-v2-summary.json
          for p in research/results/hunter-shadow-portfolio.json research/results/hunter-shadow-v2-portfolio.json; do
            [ -s "$p" ] || { echo "REFUSE_EMPTY_PORTFOLIO $p"; exit 1; }
            python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('schema')=='hunter_shadow_v2_portfolio_v2'; assert d.get('mode')=='SIMULATION_ONLY_NO_REAL_ORDERS'" "$p"
            git add -f "$p"
          done
          verify_main () {
            git fetch origin main
            for p in research/results/hunter-shadow-portfolio.json research/results/hunter-shadow-v2-portfolio.json research/results/hunter-shadow-summary.json research/results/hunter-shadow-v2-summary.json research/results/hunter-position-monitor.json; do
              git show "origin/main:$p" > "/tmp/$(basename "$p")"
              [ -s "/tmp/$(basename "$p")" ] || { echo "POST_PUSH_EMPTY $p"; return 1; }
              python -c "import json,sys; json.load(open(sys.argv[1]))" "/tmp/$(basename "$p")" || return 1
            done
            python -c "import json; v1=json.load(open('/tmp/hunter-shadow-portfolio.json')); v2=json.load(open('/tmp/hunter-shadow-v2-portfolio.json')); s1=json.load(open('/tmp/hunter-shadow-summary.json')); s2=json.load(open('/tmp/hunter-shadow-v2-summary.json')); m=json.load(open('/tmp/hunter-position-monitor.json')); lanes={x.get('lane'):x for x in m.get('results') or []}; assert lanes['SHADOW_V1']['open']==len(v1.get('open_positions') or []); assert lanes['SHADOW_V2']['open']==len(v2.get('open_positions') or []); assert s1.get('open_positions')==len(v1.get('open_positions') or []) and s1.get('closed_positions')==len(v1.get('closed_positions') or []); assert s2.get('open_positions')==len(v2.get('open_positions') or []) and s2.get('closed_positions')==len(v2.get('closed_positions') or []); assert s1.get('as_of_utc')==v1.get('updated_at_utc') and s2.get('as_of_utc')==v2.get('updated_at_utc'); print('POST_PUSH_SHADOW_STATE_VERIFIED',lanes['SHADOW_V1']['open'],lanes['SHADOW_V2']['open'])"
          }
          if git diff --cached --quiet; then
            echo NO_POSITION_STATE_CHANGE
            verify_main
            exit $?
          fi
          git commit -m 'state: five-minute Hunter position monitor'
          git fetch origin main
          BASE_PARENT=$(git rev-parse HEAD^)
          CHANGED=$(git diff --name-only "$BASE_PARENT"..origin/main || true)
          if printf '%s\n' "$CHANGED" | grep -Eq '^(research/hunter|research/results/hunter-|\.github/workflows/hunter-)'; then
            echo "SHADOW_STATE_REVISION_CHANGED_BEFORE_PUSH"
            printf '%s\n' "$CHANGED"
            exit 1
          fi
          git rebase origin/main
          git push origin HEAD:main
          verify_main
