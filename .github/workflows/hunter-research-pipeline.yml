name: Hunter Potential Research Pipeline
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rerun even when current generation is already aligned'
        type: boolean
        default: false
  workflow_run:
    workflows: ['Hunter Multi-Venue Universe Scan']
    types: [completed]
permissions:
  contents: write
concurrency:
  # Stock-Shadow style: one serialized owner for the complete downstream lifecycle.
  group: hunter-shadow-state
  cancel-in-progress: false
  queue: max
