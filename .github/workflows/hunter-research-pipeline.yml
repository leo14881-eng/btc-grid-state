    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: gate
        name: Check authoritative Vultr primary health
        run: |
          git fetch origin main
          git checkout --detach origin/main
          python -m scripts.hunter_runtime_gate research
  bind:
    needs: runtime
    if: ${{ needs.runtime.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.bind.outputs.should_run }}
      generation: ${{ steps.bind.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - id: bind
        name: Admit only the authoritative discovery generation
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python -m scripts.hunter_generation_admission
