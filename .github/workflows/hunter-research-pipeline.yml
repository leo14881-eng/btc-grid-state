name: Hunter Potential Research Pipeline
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/hunter_*.py'
      - 'tests/test_hunter*.py'
      - 'research/hunter-capital-state.json'
      - '.github/workflows/hunter-change-full-validation.yml'
  workflow_run:
    workflows: ['Hunter Binance Universe Scan']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: hunter-research-main
  cancel-in-progress: false
jobs:
  research:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Hunter change regression gate
        run: |
          set -euo pipefail
          python -m compileall -q research tests
          python -m unittest discover -s tests -p 'test_hunter*.py' -v
          python - <<'PY'
          import json, pathlib
          required=[
            'research/results/hunter-cex-universe-run.json',
            'research/results/hunter-shadow-portfolio.json',
            'research/results/hunter-shadow-v2-portfolio.json',
            'research/hunter-capital-state.json',
          ]
          for p in required:
              q=pathlib.Path(p)
              assert q.exists() and q.stat().st_size>2, f'HUNTER_REQUIRED_STATE_EMPTY {p}'
              json.loads(q.read_text())
          cap=json.load(open('research/hunter-capital-state.json'))
          assert float(cap.get('capital_pool_usdt') or 0)==20000.0, 'HUNTER_CAPITAL_POOL_MISMATCH'
          print('HUNTER_CHANGE_REGRESSION_GATE_OK')
          PY
      - name: Capture discovery generation
        id: generation
        run: |
          python - <<'PY'
          import datetime as dt,json,os
          d=json.load(open('research/results/hunter-cex-universe-run.json'))
          assert d.get('binance_complete') is True and d.get('generation_id')
          t=dt.datetime.fromisoformat(d['as_of_utc'].replace('Z','+00:00'))
          age=(dt.datetime.now(dt.timezone.utc)-t).total_seconds()
          assert -300 <= age <= 1800, f'STALE_DISCOVERY age_seconds={age:.0f}'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('id='+d['generation_id'],file=f)
          print('RESEARCH_INPUT_GENERATION',d['generation_id'])
          PY
      - name: Hunter v4 PRE_MOVE multi-factor funnel
        run: python research/hunter_early_signals.py
      - name: Forward-upside research
        run: python research/hunter_forward_research.py
      - name: Identity audit
        run: python research/hunter_identity_audit.py
      - name: Forward outcome audit
        run: python research/hunter_forward_audit.py
      - name: Candidate dossiers
        run: python research/hunter_candidate_dossiers.py
      - name: Liquidity only for shortlisted candidates
        run: python research/hunter_liquidity_probe.py
      - name: Rebuild dossiers with execution evidence
        run: python research/hunter_candidate_dossiers.py
      - name: Primary-source lead discovery
        continue-on-error: true
        run: python research/hunter_primary_source_discovery.py
      - name: Official-source evidence enrichment
        run: python research/hunter_evidence_enrichment.py
      - name: Research completion state
        run: python research/hunter_research_completion.py
      - name: Rebuild dossiers with completion state
        run: python research/hunter_candidate_dossiers.py
      - name: Tactical supply and unlock risk
        run: python research/hunter_tactical_supply_risk.py
      - name: Tactical short-horizon capital review
        run: python research/hunter_tactical_capital_review.py
      - name: Health and candidate gate report
        run: python research/hunter_health_and_queue.py
      - name: Validate shadow engines
        run: python -m unittest tests.test_hunter_shadow_trader tests.test_hunter_shadow_trader_v2 tests.test_hunter_shadow_optimizer -v
      - name: Shadow optimizer frozen pending user acceptance
        run: echo "SHADOW_STRATEGY_FREEZE optimizer_writes=0"
      - name: Run V1 broad-net shadow orders
        env:
          HUNTER_SHADOW_FREEZE: '0'
        run: |
          for attempt in 1 2 3; do
            if python research/hunter_shadow_trader.py; then exit 0; fi
            echo "SHADOW_ENGINE_RETRY attempt=$attempt"
            sleep $((attempt*2))
          done
          exit 1
      - name: Verify V1 EARLY coverage and state integrity
        run: |
          python - <<'PY'
          import json
          early=json.load(open('research/results/hunter-early-signals.json'))
          state=json.load(open('research/results/hunter-shadow-portfolio.json'))
          expected={x['base'] for x in early.get('early',[]) if x.get('base')}
          opens=state.get('open_positions') or []
          actual=[x.get('asset') for x in opens if x.get('asset')]
          duplicates=sorted({a for a in actual if actual.count(a)>1})
          entered={x.get('asset') for x in state.get('events',[]) if x.get('type')=='SHADOW_V1_BUY' and x.get('asset')}
          missing=sorted(expected-(set(actual)|entered))
          assert not duplicates, f'V1_DUPLICATE_OPEN_ASSETS {duplicates}'
          assert not missing, f'V1_EARLY_COVERAGE_MISSING_NEVER_ENTERED count={len(missing)} sample={missing[:20]}'
          assert len(expected)==int(early.get('early_count') or 0), 'V1_EARLY_COUNT_MISMATCH'
          assert state.get('mode')=='SIMULATION_ONLY_NO_REAL_ORDERS'
          assert state.get('events'), 'V1_EVENTS_EMPTY'
          assert len(state.get('decisions') or []) <= 1500, 'V1_DECISION_HISTORY_UNBOUNDED'
          summary=json.load(open('research/results/hunter-shadow-summary.json'))
          assert int(summary.get('open_positions') or 0)==len(opens), 'V1_SUMMARY_OPEN_MISMATCH'
          assert int(summary.get('closed_positions') or 0)==len(state.get('closed_positions') or []), 'V1_SUMMARY_CLOSED_MISMATCH'
          print(f'V1_EARLY_COVERAGE_OK early={len(expected)} open={len(actual)} entered_history={len(entered)} legacy_open={len(set(actual)-expected)} decisions={len(state.get("decisions") or [])}')
          PY
      - name: Refresh official Bybit execution channels
        env:
          BYBIT_ALPHA_API_KEY: ${{ secrets.BYBIT_ALPHA_API_KEY }}
          BYBIT_ALPHA_API_SECRET: ${{ secrets.BYBIT_ALPHA_API_SECRET }}
          HUNTER_PROXY_TOKEN: ${{ secrets.HUNTER_PROXY_TOKEN }}
        run: python research/hunter_bybit_availability.py
      - name: Run V2 executable shadow orders
        env:
          HUNTER_SHADOW_FREEZE: '0'
        run: |
          for attempt in 1 2 3; do
            if python research/hunter_shadow_trader_v2.py; then exit 0; fi
            echo "V2_SHADOW_ENGINE_RETRY attempt=$attempt"
            sleep $((attempt*2))
          done
          exit 1
      - name: Verify V2 shadow state integrity
        run: |
          python - <<'PY'
          import json
          state=json.load(open('research/results/hunter-shadow-v2-portfolio.json'))
          review=json.load(open('research/results/hunter-tactical-capital-review.json'))
          assert state.get('mode')=='SIMULATION_ONLY_NO_REAL_ORDERS'
          assert state.get('schema')=='hunter_shadow_v2_portfolio_v2'
          opens=state.get('open_positions') or []
          assets=[x.get('asset') for x in opens if x.get('asset')]
          assert len(assets)==len(set(assets)), f'V2_DUPLICATE_OPEN_ASSETS {assets}'
          used=sum(sum(float(t.get('notional_usdt') or 0) for t in x.get('tranches') or []) for x in opens)
          assert used <= 20000.000001, f'V2_CAPITAL_POOL_EXCEEDED {used}'
          buyset=set(review.get('executable_buy') or [])
          current_generation=review.get('scan_generation_id')
          current_open={x.get('asset') for x in opens if x.get('scan_generation_id')==current_generation}
          assert current_open <= buyset, f'V2_ENTRY_NOT_AUTHORIZED_BY_CAPITAL_REVIEW {sorted(current_open-buyset)}'
          assert all(x.get('trade_action') in ('BUY','WAIT','REJECT','SYSTEM_BLOCKED') for x in review.get('candidates') or []), 'V2_FINAL_ACTION_MISSING'
          print(f'V2_SHADOW_ACTIVE_OK open={len(opens)} used_usdt={used:.2f} executable_buy={sorted(buyset)} decisions={len(state.get("decisions") or [])}')
          PY
      - name: Reject mixed-generation research
        env:
          EXPECTED: ${{ steps.generation.outputs.id }}
        run: |
          python - <<'PY'
          import json,os
          s=json.load(open('research/results/hunter-cex-universe-run.json'))
          r=json.load(open('research/results/hunter-forward-research.json'))
          h=json.load(open('research/results/hunter-health-and-queue.json'))
          assert s['generation_id']==os.environ['EXPECTED']
          assert r['universe_scan_as_of_utc']==s['as_of_utc']
          assert h['scan_as_of_utc']==s['as_of_utc']
          print('DOWNSTREAM_GENERATION_VERIFIED',os.environ['EXPECTED'])
          PY
      - name: Persist downstream results without touching discovery
        env:
          EXPECTED: ${{ steps.generation.outputs.id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in \
            research/results/hunter-forward-research.json \
            research/results/hunter-early-signals.json \
            research/results/hunter-market-enrichment.json \
            research/results/hunter-identity-audit.json \
            research/results/hunter-forward-audit.json \
            research/results/hunter-contract-corroboration-cache.json \
            research/results/hunter-candidate-dossiers.json \
            research/results/hunter-liquidity-probe.json \
            research/results/hunter-health-and-queue.json \
            research/results/hunter-tactical-capital-review.json \
            research/results/hunter-tactical-supply-risk.json \
            research/results/hunter-research-completion.json \
            research/results/hunter-evidence-enrichment.json \
            research/results/hunter-primary-source-leads.json \
            research/results/hunter-primary-source-cache.json \
            research/results/hunter-api-cooldown.json \
            research/results/hunter-shadow-portfolio.json \
            research/results/hunter-shadow-summary.json \
            research/results/hunter-shadow-v2-portfolio.json \
            research/results/hunter-shadow-v2-summary.json \
            research/results/hunter-shadow-v2-overfilter-guard.json \
            research/results/hunter-bybit-availability.json \
            research/results/hunter-bybit-spot-cache.json \
            research/results/hunter-shadow-candidate-ledger.json \
            research/results/hunter-shadow-rules.json \
            research/results/hunter-shadow-optimizer-audit.jsonl; do
            if [ -f "$file" ]; then git add -f "$file"; else echo "OPTIONAL_RESULT_MISSING $file"; fi
          done
          if git diff --cached --quiet; then
            echo "PERSISTENCE_ERROR_NO_STAGED_RESULTS"
            git status --short --ignored
            exit 1
          fi
          git commit -m 'research: Hunter downstream potential-candidate analysis'
          git stash push --all -m 'hunter-nonpersistent-runtime-files' || true
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              git fetch origin main
              git show origin/main:research/results/hunter-cex-universe-run.json > /tmp/scan.json
              git show origin/main:research/results/hunter-forward-research.json > /tmp/forward.json
              git show origin/main:research/results/hunter-health-and-queue.json > /tmp/health.json
              git show origin/main:research/results/hunter-research-completion.json > /tmp/completion.json
              git show origin/main:research/results/hunter-shadow-portfolio.json > /tmp/shadow.json
              git show origin/main:research/results/hunter-shadow-summary.json > /tmp/shadow-summary.json
              git show origin/main:research/results/hunter-shadow-v2-portfolio.json > /tmp/shadow-v2.json
              python -c "import json; a=json.load(open('/tmp/shadow.json')); b=json.load(open('/tmp/shadow-v2.json')); assert a.get('open_positions') or a.get('events'), 'V1_SHADOW_EXPECTED_ACTIVE'; assert b.get('schema')=='hunter_shadow_v2_portfolio_v2'; assert b.get('mode')=='SIMULATION_ONLY_NO_REAL_ORDERS'; used=sum(sum(float(t.get('notional_usdt') or 0) for t in x.get('tranches') or []) for x in b.get('open_positions') or []); assert used<=20000.000001, f'V2_CAPITAL_POOL_EXCEEDED {used}'; print('V1_V2_SHADOW_ACTIVE_READBACK_OK', 'v2_open='+str(len(b.get('open_positions') or [])), 'v2_used='+str(round(used,2)))"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*2))
          done
          exit 1

