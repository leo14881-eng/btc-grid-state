name: Hunter Market Adapter Isolated Validation
on:
  push:
    branches: ['codex/hunter-market-adapters-isolated']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hunter-market-adapter-isolated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check out immutable main baseline
        uses: actions/checkout@v4
        with:
          ref: '59dcce8ab972e30349a4774cf324ae6d85b760b3'
          path: baseline-main
          persist-credentials: false
      - name: Existing Hunter tests plus isolated adapter fixtures
        env:
          HUNTER_VENUE_EXECUTION_ADAPTERS_ENABLED: '0'
        run: python -m unittest discover -s tests -p 'test_hunter*.py' -v
      - name: Worker route regression and new adapter routes
        run: |
          node tests/test_hunter_bybit_proxy.mjs
          node tests/test_hunter_market_proxy.mjs
      - name: Frozen main versus adapter decisions and PnL
        env:
          FROZEN_MAIN_SHA: '59dcce8ab972e30349a4774cf324ae6d85b760b3'
        run: python research/validate_market_adapter_isolation.py --baseline "$PWD/baseline-main"
      - name: Bounded public API latency and capability probes
        env:
          HUNTER_BYBIT_SPOT_PROXY: 'https://hunter-bybit-market-v3.qinx468.workers.dev'
          REQUIRE_BYBIT_V3_ACCEPTANCE: '1'
        run: python research/validate_market_adapter_isolation.py --live
      - name: Ensure no state mutation was published
        run: git diff --exit-code -- research/results
