name: Binance control WAL scratch-only lock diagnosis

on:
  pull_request:
    paths:
      - scripts/probe_binance_control_wal_soak.py
      - .github/workflows/binance-control-wal-diagnosis.yml

permissions:
  contents: read

jobs:
  control-wal-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact pinned checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Control DELETE to WAL only in isolated CI fixture; no production writes
        run: python -B -X utf8 scripts/probe_binance_control_wal_soak.py
