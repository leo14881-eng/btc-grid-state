name: Hunter Stability and Execution Rebind Validation
on:
  pull_request:
    paths:
      - 'research/hunter_lifecycle_*.py'
      - 'tests/test_hunter_lifecycle_state.py'
      - 'scripts/hunter_research_rebind.py'
      - 'scripts/hunter_monitor_runner.sh'
      - 'research/hunter_position_monitor.py'
      - 'research/hunter_shadow_trader_v2.py'
      - 'research/hunter_portfolio_integrity.py'
      - 'tests/test_hunter_portfolio_integrity.py'
      - 'tests/test_hunter_research_rebind.py'
      - '.github/workflows/hunter-research-pipeline.yml'
      - '.github/workflows/hunter-stability-validation.yml'
  push:
    branches: ['fix/hunter-stability-observability-20261006']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for the complete Hunter regression
        run: python -m pip install -r deploy/hunter-binance-stream-requirements.txt -r deploy/hunter-fast-watch-requirements.txt
      - name: Compile, shell syntax and complete Hunter regression
        run: |
          python -m py_compile scripts/hunter_research_rebind.py research/hunter_position_monitor.py
          bash -n scripts/hunter_monitor_runner.sh
          python -m unittest discover -s tests -p 'test_hunter*.py' -v
      - name: Preserve shadow and capital boundaries
        run: |
          python - <<'PY'
          import json
          d=json.load(open('research/results/hunter-shadow-rules.json'))
          assert d['lanes']['V2']['capital_pool_usdt']==20000
          assert d['capital_authority']=='NONE_SHADOW_ONLY'
          assert d['tail_risk_phase1']['real_trading_enabled'] is False
          print('SHADOW_INVARIANTS_PASS')
          PY
