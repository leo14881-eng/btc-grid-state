name: Hunter Vultr Runner Infrastructure
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/hunter_monitor_*'
      - 'scripts/hunter_portfolio_lock.py'
      - 'scripts/hunter_lock_capacity.py'
      - 'scripts/hunter_job_runner.py'
      - 'tests/test_hunter_portfolio_lock.py'
      - 'tests/test_hunter_lock_capacity.py'
      - 'tests/test_hunter_monitor_retry.py'
      - 'tests/test_hunter_monitor_persist.py'
      - 'tests/test_hunter_monitor_snapshot.py'
      - 'tests/test_hunter_history_parallel.py'
      - 'research/hunter_position_monitor.py'
      - 'research/hunter_shadow_trader_v2.py'
      - 'deploy/hunter-vultr-runner.md'
      - 'deploy/systemd/hunter-position-monitor.*'
      - '.github/workflows/hunter-vultr-runner-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies for the complete Hunter regression
        run: python -m pip install -r deploy/hunter-binance-stream-requirements.txt -r deploy/hunter-fast-watch-requirements.txt
      - name: Shell syntax and complete Hunter regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          bash -n scripts/hunter_monitor_runner.sh
          python -m unittest discover -s tests -p 'test_hunter*.py'
      - name: Validate authoritative snapshot contract
        run: |
          # Hourly Research may legitimately supersede the working portfolios.
          # Validate the exact Monitor publication, never splice those writers.
          python - <<'PY'
          import json, re
          from scripts.hunter_monitor_persist import git, snapshot, validate
          health = json.load(open('research/results/hunter-runtime-monitor-health.json'))
          assert health.get('schema') == 'hunter_runtime_job_health_v1'
          assert health.get('job') == 'monitor' and health.get('source') == 'VULTR_SYSTEMD'
          assert health.get('status') == 'SUCCESS' and health.get('main_readback_verified') is True
          assert health.get('real_trading_enabled') is False
          assert health.get('capital_authority') == 'NONE_SHADOW_ONLY'
          ref = health.get('main_readback_head_sha', '')
          assert re.fullmatch(r'[0-9a-f]{40}', ref), 'VERIFIED_MONITOR_REF_REQUIRED'
          git('fetch', '--no-tags', 'origin', ref)
          counts = validate(snapshot(ref), health['monitor_generation_id'])
          print('PINNED_MONITOR_SNAPSHOT_CONTRACT_OK', ref, counts)
          PY
  isolated-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Current and amplified offline publication capacity
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python scripts/hunter_lock_capacity.py --source-ref HEAD --scales 1 2 5 --iterations 2 --workers 2 --output /tmp/hunter-lock-capacity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunter-lock-capacity
          path: /tmp/hunter-lock-capacity.json
          if-no-files-found: error
      - name: Auditable capacity metrics
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/hunter-lock-capacity.json')
          assert p.is_file(), 'CAPACITY_REPORT_MISSING'
          r=json.loads(p.read_text())
          print('CAPACITY_SOURCE',r['source']['commit_sha'],'unchanged',r['source_worktree_unchanged'])
          for s in r['scenarios']:
              print('CAPACITY_SCENARIO',json.dumps({k:s[k] for k in ('scale','status','snapshot','scenario_total_seconds','published_commit_count')}))
              for c in s['cycles']:
                  print('CAPACITY_CYCLE',json.dumps({k:v for k,v in c.items() if k not in ('audit_log','traceback')}))
          PY
  snapshot-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline batch faults and paired publication measurements
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest tests.test_hunter_monitor_snapshot -v
          python scripts/hunter_monitor_snapshot_benchmark.py --source-ref HEAD --iterations 100 --cycles 12 --output /tmp/hunter-snapshot-ab.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunter-snapshot-ab
          path: /tmp/hunter-snapshot-ab.json
          if-no-files-found: error

  history-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable input fixture only
        run: git fetch --no-tags --depth=1 origin 390fca24a4bcd3537739f0a4caa48dba8e070aab
      - name: Historical page faults and complete paired monitor replay
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: |
          python -m unittest tests.test_hunter_history_parallel -v
          python scripts/hunter_monitor_history_benchmark.py --code-ref HEAD --iterations 3 --history-delay 0.2 --output /tmp/hunter-history-ab.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hunter-history-ab
          path: /tmp/hunter-history-ab*.json
          if-no-files-found: error

