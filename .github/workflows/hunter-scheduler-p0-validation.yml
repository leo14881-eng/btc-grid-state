name: Hunter Scheduler P0 Isolated Validation
on:
  push:
    branches: [fix/hunter-scheduler-p0-20261006]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hunter-scheduler-p0-validation
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scheduler generation and health tests
        run: python -m unittest tests.test_hunter_scheduler_health -v
      - name: Existing Hunter V1/V2 regression
        run: python -m unittest discover -s tests -p 'test_hunter*.py' -v
      - name: Shadow invariants
        run: |
          python - <<'PY'
          import json
          for p in ['research/results/hunter-shadow-portfolio.json','research/results/hunter-shadow-v2-portfolio.json']:
              d=json.load(open(p)); assert d['mode']=='SIMULATION_ONLY_NO_REAL_ORDERS'
          s=json.load(open('research/results/hunter-shadow-v2-summary.json'))
          c=s['policy']['capital_management']
          assert float(c['initial_capital_usdt'])==20000.0
          print('HUNTER_P0_INVARIANTS_OK')
          PY
