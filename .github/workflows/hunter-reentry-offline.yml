name: Hunter shared reentry offline regression
on:
  push:
    branches: ['codex/reentry-loss-integration-check']
  pull_request:
    paths:
      - 'research/hunter_reentry.py'
      - 'research/hunter_signal_provenance.py'
      - 'research/hunter_strategy_release.py'
      - 'research/hunter_early_signals.py'
      - 'research/hunter_identity_audit.py'
      - 'research/hunter_tactical_capital_review.py'
      - 'research/hunter_shadow_trader_v2.py'
      - 'tests/test_hunter_reentry.py'
      - 'tests/test_hunter_reentry_hourly.py'
      - 'research/hunter_bybit_signal_capture.py'
      - 'research/hunter_bybit_worker.py'
      - 'research/hunter_bybit_regional.py'
      - 'research/hunter_bybit_management.py'
      - 'tests/test_hunter_shadow_trader_v2.py'
      - '.github/workflows/hunter-reentry-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing local transport test dependency
        run: python -m pip install -r deploy/hunter-fast-watch-requirements.txt
      - name: Verify exact integration ancestry and immutable history
        run: |
          git merge-base --is-ancestor 30aad45082e8dd9e62405ab4fb37e5fd65abe3d4 HEAD
          git merge-base --is-ancestor 16be9faaffd0163398e7e3c9bc32b92694d30859 HEAD
          git merge-base --is-ancestor 67f661287569b91cf7a01d9d5798af350c1f5276 HEAD
          git diff --exit-code 30aad45082e8dd9e62405ab4fb37e5fd65abe3d4 HEAD -- research/results
          git diff --exit-code 16be9faaffd0163398e7e3c9bc32b92694d30859 HEAD -- research/hunter_reentry.py research/hunter_signal_provenance.py research/hunter_strategy_release.py research/hunter_early_signals.py research/hunter_identity_audit.py research/hunter_tactical_capital_review.py tests/test_hunter_reentry.py
          git diff --exit-code 67f661287569b91cf7a01d9d5798af350c1f5276 HEAD -- research/hunter_loss_freeze.py research/hunter_position_monitor.py tests/test_hunter_loss_freeze.py
      - name: Complete offline Hunter regression and synthetic replays
        run: python -m unittest discover -s tests -p 'test_hunter*.py' -v
