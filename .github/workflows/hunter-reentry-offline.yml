name: Hunter shared reentry offline regression
on:
  pull_request:
    paths:
      - 'research/hunter_reentry.py'
      - 'research/hunter_shadow_trader_v2.py'
      - 'tests/test_hunter_reentry.py'
      - 'tests/test_hunter_shadow_trader_v2.py'
      - '.github/workflows/hunter-reentry-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_hunter*.py'
