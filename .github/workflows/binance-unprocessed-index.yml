name: Binance unresolved receipts indexed equivalence

on:
  pull_request:
    paths:
      - research/hunter_binance_health_store.py
      - research/hunter_binance_market_control.py
      - research/hunter_binance_stream_store.py
      - tests/test_hunter_binance_unprocessed_index.py
      - .github/workflows/binance-unprocessed-index.yml

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Partial index and full revocation-scope equivalence
        run: |
          python -B -X utf8 -m unittest -v \
            tests.test_hunter_binance_unprocessed_index \
            tests.test_hunter_binance_consumer_fence \
            tests.test_hunter_binance_coordinated_runtime \
            tests.test_hunter_binance_readiness_point_lookup \
            tests.test_hunter_binance_market_wal_offline
