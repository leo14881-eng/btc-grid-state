name: Binance batch epoch equivalence

on:
  pull_request:
    paths:
      - research/hunter_binance_stream_store.py
      - research/hunter_binance_health_store.py
      - tests/test_hunter_binance_ingest_equivalence.py
      - .github/workflows/binance-batch-epoch-equivalence.yml

permissions:
  contents: read

jobs:
  batch-epoch-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact candidate SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Full durable SQLite outcomes and frozen-output equivalence
        run: python -B -X utf8 -m unittest -v tests.test_hunter_binance_ingest_equivalence
