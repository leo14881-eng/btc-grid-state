name: Sentinel Runtime Validation
on:
  pull_request:
    paths:
      - 'scripts/sentinel_*'
      - 'sentinel-runtime.json'
      - 'tests/test_sentinel*.py'
      - 'deploy/systemd/sentinel-*'
      - '.github/workflows/sentinel-runtime-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_sentinel*.py'
      - run: bash -n scripts/sentinel_scheduled_job.sh
