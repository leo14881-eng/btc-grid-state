name: Hunter shared loss AND market offline tests
on:
  pull_request:
    paths:
      - 'research/hunter_loss_freeze.py'
      - 'research/hunter_shadow_trader_v2.py'
      - 'research/hunter_position_monitor.py'
      - 'tests/test_hunter_loss_freeze.py'
      - '.github/workflows/hunter-loss-freeze-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_hunter_loss_freeze tests.test_hunter_tail_risk tests.test_hunter_circuit_integration tests.test_hunter_shadow_trader_v2 tests.test_hunter_shadow_trader tests.test_hunter_position_monitor tests.test_hunter_manual_stop_once tests.test_hunter_manual_stop_monitor tests.test_hunter_lifecycle_state tests.test_hunter_monitor_persist tests.test_hunter_trade_notifications tests.test_hunter_monitor_runtime tests.test_hunter_generation_admission tests.test_hunter_execution_cost tests.test_hunter_portfolio_integrity -v
