name: Bybit Proxy Diagnostic

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/bybit-proxy-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      BYBIT_ALPHA_API_KEY: ${{ secrets.BYBIT_ALPHA_API_KEY }}
      BYBIT_ALPHA_API_SECRET: ${{ secrets.BYBIT_ALPHA_API_SECRET }}
    steps:
      - name: Test Worker debug and Bybit proxy
        run: |
          set -o pipefail
          echo "=== DEBUG POST-PLACEMENT ==="
          curl -sS -D /tmp/debug.h -o /tmp/debug.b -w "HTTP=%{http_code}\n" --max-time 20 "https://bybit-api-test.qinx468.workers.dev/debug" || true
          cat /tmp/debug.h || true
          cat /tmp/debug.b || true
          echo
          echo "=== HUNTER AVAILABILITY ==="
          git clone -q --depth 1 "https://github.com/leo14881-eng/btc-grid-state.git" /tmp/hunter
          cd /tmp/hunter
          python research/hunter_bybit_availability.py
          cat research/results/hunter-bybit-availability.json
          cd -
          echo "=== BTCUSDT ==="
          curl -sS -D /tmp/btc.h -o /tmp/btc.b -w "HTTP=%{http_code}\n" --max-time 20 "https://bybit-api-test.qinx468.workers.dev/bybit/spot?symbol=BTCUSDT" || true
          cat /tmp/btc.h || true
          cat /tmp/btc.b || true
          echo
          echo "=== RUNNER ACCEPTANCE ==="
          python - <<'PY'
          import json, urllib.request
          url="https://bybit-api-test.qinx468.workers.dev/bybit/spot?symbol=BTCUSDT"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/153.0 Safari/537.36","Accept":"application/json,text/plain,*/*"})
          with urllib.request.urlopen(req,timeout=20) as r:
              status=r.status
              d=json.load(r)
          rows=(d.get("result") or {}).get("list") or []
          row=next((x for x in rows if x.get("symbol")=="BTCUSDT"),None)
          assert status==200, status
          assert d.get("retCode")==0, d
          assert d.get("retMsg")=="OK", d
          assert row and row.get("status")=="Trading", row
          print(json.dumps({"endpoint":"/bybit/spot?symbol=BTCUSDT","http_status":status,"retCode":d.get("retCode"),"retMsg":d.get("retMsg"),"symbol":"BTCUSDT","business_status":row.get("status")}))
          persisted=json.load(open("/tmp/hunter/research/results/hunter-bybit-availability.json"))
          assert persisted["spot"]["status"].startswith("OK_"), persisted["spot"]
          assert persisted["spot"].get("error_reason") is None, persisted["spot"]
          print("PERSISTED_SPOT",json.dumps(persisted["spot"]))
          PY
          echo
