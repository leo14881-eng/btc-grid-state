name: Hunter isolated manual stop offline tests
on:
  pull_request:
    paths:
      - 'research/hunter_manual_stop_once.py'
      - 'tests/test_hunter_manual_stop_once.py'
      - '.github/workflows/hunter-manual-stop-offline.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_hunter_manual_stop_once.py' -v
      - run: python -m unittest discover -s tests -p 'test_hunter_lifecycle_state.py' -v
