name: Stock Shadow Position Monitor

# API_BATCH_ACCEPTANCE_TRIGGER_20261005_FINAL
# API_BATCH_ACCEPTANCE_TRIGGER_20261005_FINAL2
# CLEAN_BASELINE_ACCEPTANCE_20261004
# Position-only acceptance: Alpaca SIP batched quotes; forced validation is non-trading and must preserve the full ledger.
# REVALIDATE_RESTORED_308_COHORT_20261004
# CACHE_FIRST_BATCH_ACCEPTANCE_20261004

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research/stock_shadow/stock_position_monitor.py'
      - 'research/stock_shadow/market_session.py'
      - 'research/stock_shadow/state_safety.py'
      - 'research/stock_shadow/stock_review.py'
      - 'research/stock_shadow/isolation_guard.sh'
      - 'research/stock_shadow/persist_results.sh'
      - 'tests/test_stock_shadow.py'
      - 'tests/test_stock_server_migration.py'
      - '.github/stock-runtime.json'
      - 'research/stock_shadow/server/**'
      - 'deploy/stock-shadow/**'
      - '.github/workflows/stock-shadow-position-monitor.yml'
  schedule:
    - cron: '2/5 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-shadow-main
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Admit authoritative stock writer
        id: admission
        run: python3 -m research.stock_shadow.server.runtime admit --owner github --job monitor --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}"
      - uses: actions/setup-python@v5
        if: steps.admission.outputs.should_run == 'true'
        with:
          python-version: '3.12'
      - name: Install test dependency
        if: steps.admission.outputs.should_run == 'true'
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test isolated Stock Shadow
        if: steps.admission.outputs.should_run == 'true'
        run: python -m pytest -q tests/test_stock_shadow.py tests/test_stock_server_migration.py
      - name: P0 weekend and final mutation gate acceptance
        if: steps.admission.outputs.should_run == 'true'
        run: python -m pytest -q tests/test_stock_shadow.py -k p0
      - name: Position-only 5m monitor
        if: steps.admission.outputs.should_run == 'true'
        id: stock_monitor
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python research/stock_shadow/stock_position_monitor.py
          else
            python research/stock_shadow/stock_position_monitor.py --force
          fi
      - name: Winner loser review
        if: steps.admission.outputs.should_run == 'true'
        run: python research/stock_shadow/stock_review.py
      - name: Isolation guard
        if: steps.admission.outputs.should_run == 'true'
        run: |
          bash research/stock_shadow/isolation_guard.sh
      - name: Persist Stock Shadow position state only
        if: steps.admission.outputs.should_run == 'true'
        run: bash research/stock_shadow/persist_results.sh monitor

# TEST_REPAIR_RERUN_20261005

# FINAL_API_ARCH_ACCEPTANCE_R3

# FINAL_ACCEPTANCE_R4

# MONITOR_FINAL_TRIGGER_R5


      - name: Persist failure health only
        if: ${{ failure() && steps.admission.outputs.should_run == 'true' && steps.stock_monitor.outcome == 'failure' }}
        run: |
          bash research/stock_shadow/isolation_guard.sh
          bash research/stock_shadow/persist_results.sh health
