name: Stock Shadow Position Monitor

# API_BATCH_ACCEPTANCE_TRIGGER_20261005_FINAL
# API_BATCH_ACCEPTANCE_TRIGGER_20261005_FINAL2
# CLEAN_BASELINE_ACCEPTANCE_20261004
# Position-only acceptance: Alpaca SIP batched quotes; forced validation is non-trading and must preserve the full ledger.
# REVALIDATE_RESTORED_308_COHORT_20261004
# CACHE_FIRST_BATCH_ACCEPTANCE_20261004

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: 'Infrastructure trigger source only'
        required: false
        default: 'manual'
  push:
    branches: [main]
    paths:
      - 'research/stock_shadow/stock_position_monitor.py'
      - 'research/stock_shadow/market_session.py'
      - 'research/stock_shadow/persist_results.sh'
      - 'tests/test_stock_shadow.py'
      - '.github/workflows/stock-shadow-position-monitor.yml'
  schedule:
    - cron: '2/5 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: stock-shadow-position-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Refresh authoritative shadow state
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Generation idempotency gate
        id: generation
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          echo "started_at=$STARTED_AT" >> "$GITHUB_OUTPUT"
          RESULT=$(python -m research.stock_shadow_scheduler_health gate)
          echo "$RESULT"
          PROCESS=$(python -c "import json,sys; print(str(json.load(sys.stdin)['process']).lower())" <<<"$RESULT")
          echo "process=$PROCESS" >> "$GITHUB_OUTPUT"
          echo "trigger_source=$TRIGGER_SOURCE" >> "$GITHUB_OUTPUT"
      - name: Bind execution version
        run: |
          echo "STOCK_SHADOW_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "STOCK_SHADOW_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Test isolated Stock Shadow
        if: steps.generation.outputs.process == 'true'
        run: python -m pytest -q tests/test_stock_shadow.py
      - name: P0 weekend and final mutation gate acceptance
        if: steps.generation.outputs.process == 'true'
        run: python -m pytest -q tests/test_stock_shadow.py -k p0
      - name: Position-only 5m monitor
        if: steps.generation.outputs.process == 'true'
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python research/stock_shadow/stock_position_monitor.py
          else
            python research/stock_shadow/stock_position_monitor.py --force
          fi
      - name: Mark successful generation for persistence
        if: steps.generation.outputs.process == 'true'
        env:
          MONITOR_STARTED_AT: ${{ steps.generation.outputs.started_at }}
          TRIGGER_SOURCE: ${{ steps.generation.outputs.trigger_source }}
        run: python -m research.stock_shadow_scheduler_health success --started-at "$MONITOR_STARTED_AT" --trigger-source "$TRIGGER_SOURCE" --state-revision "$(git rev-parse HEAD)"
      - name: Isolation guard
        if: steps.generation.outputs.process == 'true'
        run: |
          git diff --name-only | grep -Ev '^research/results/stock-shadow/' && { echo "Isolation violation"; exit 1; } || true
      - name: Persist Stock Shadow position state only
        if: steps.generation.outputs.process == 'true'
        run: bash research/stock_shadow/persist_results.sh monitor

