# Optional reviewed drop-in. Not installed or enabled by the stage script.
# Install only after collector, consumers and ops readers use the same reviewed
# release. Restart=no and the existing bounded circuit breaker remain in force.
[Service]
ExecStart=
ExecStart=/opt/hunter-bybit-stream/venv/bin/python -B -m research.hunter_bybit_stream --manifest /var/lib/hunter-bybit-stream/manifest.json --source-head-file /opt/hunter-bybit-stream/release-head --collect --health-supervision
TimeoutStopSec=90
